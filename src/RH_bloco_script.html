<script>
let cfgRH=null,colabsRH=[],docsRH=[],tColabRH=null,tDocRH=null,tFolhaRH=null;
function abrirTelaRH(b){marcarMenuAtivo(b);fecharMenuMobile();esconderMensagem();esconderTelas();const t=document.getElementById('tela-rh'),p=document.querySelector('main.pagina');if(!t){mostrarMensagem('Tela RH não encontrada.','erro');return;}if(p&&t.parentElement!==p)p.appendChild(t);['modalColaboradorRH','modalDocumentoRH','modalEdicaoDocumentoRH','modalFolhaRH'].forEach(id=>{const m=document.getElementById(id);if(p&&m&&m.parentElement!==p)p.appendChild(m)});t.classList.remove('oculto');carregarConfiguracoesRH();}
function carregarConfiguracoesRH(){if(cfgRH){preencherCfgRH();carregarColaboradoresRH();return;}google.script.run.withSuccessHandler(c=>{cfgRH=c||{};preencherCfgRH();carregarColaboradoresRH();}).withFailureHandler(exibirErro).obterConfiguracoesRH();}
function preencherCfgRH(){selectRH('rhColaboradorStatus',cfgRH.statusColaborador,'Selecione');selectRH('filtroStatusColaboradorRH',cfgRH.statusColaborador,'Todos');selectRH('rhDocumentoTipo',cfgRH.tiposDocumento,'Selecione');selectRH('rhEdicaoDocumentoTipo',cfgRH.tiposDocumento,'Selecione');selectRH('filtroTipoDocumentoRH',cfgRH.tiposDocumento,'Todos');}
function selectRH(id,itens,rot){const s=document.getElementById(id);if(!s)return;const atual=s.value;s.innerHTML=`<option value="">${escapar(rot)}</option>`;(itens||[]).forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;s.appendChild(o)});if([...s.options].some(o=>o.value===atual))s.value=atual;}
function trocarAbaRH(a){['colaboradores','documentos','folhas'].forEach(x=>{document.getElementById('conteudoRH'+(x==='colaboradores'?'Colaboradores':x==='documentos'?'Documentos':'Folhas')).classList.toggle('oculto',x!==a);document.getElementById('abaRH'+(x==='colaboradores'?'Colaboradores':x==='documentos'?'Documentos':'Folhas')).classList.toggle('ativa',x===a)});if(a==='documentos')carregarDocumentosRH();if(a==='folhas')carregarFolhasPontoRH();}
function agendarBuscaColaboradorRH(){clearTimeout(tColabRH);tColabRH=setTimeout(carregarColaboradoresRH,350)}
function carregarColaboradoresRH(){google.script.run.withSuccessHandler(l=>{colabsRH=Array.isArray(l)?l:[];renderColabsRH();preencherColabsRH();}).withFailureHandler(exibirErro).listarColaboradoresRH({termo:valor('filtroTermoColaboradorRH'),status:valor('filtroStatusColaboradorRH')});}
function renderColabsRH(){definirTextoRH('quantidadeColaboradoresRH',`${colabsRH.length} colaborador${colabsRH.length===1?'':'es'}`);const c=document.getElementById('corpoTabelaColaboradoresRH');c.innerHTML=colabsRH.length?colabsRH.map(x=>`<tr><td><strong>${escapar(x.nome)}</strong><small class="dado-rh-secundario">${escapar(x.idColaborador)}</small></td><td>${escapar(x.cargo)}</td><td>${escapar(x.telefone||'—')}<small class="dado-rh-secundario">${escapar(x.email||'')}</small></td><td>${escapar(x.dataAdmissao||'—')}</td><td><span class="status-rh status-rh-${x.status==='ATIVO'?'ativo':x.status==='AFASTADO'?'afastado':'desligado'}">${escapar(x.status)}</span></td></tr>`).join(''):`<tr><td colspan="5" class="estado-vazio">Nenhum colaborador encontrado.</td></tr>`;}
function preencherColabsRH(){[{id:'rhDocumentoColaborador',todos:false,rot:'Selecione'},{id:'rhFolhaColaborador',todos:false,rot:'Selecione'},{id:'rhEdicaoDocumentoColaborador',todos:true,rot:'Selecione'},{id:'filtroColaboradorDocumentoRH',todos:true,rot:'Todos'},{id:'filtroColaboradorFolhaRH',todos:true,rot:'Todos'}].forEach(cfg=>{const s=document.getElementById(cfg.id);if(!s)return;const atual=s.value;s.innerHTML=`<option value="">${cfg.rot}</option>`;colabsRH.filter(x=>cfg.todos||x.status==='ATIVO').forEach(x=>{const o=document.createElement('option');o.value=x.idColaborador;o.textContent=`${x.nome} — ${x.cargo}`;s.appendChild(o)});if([...s.options].some(o=>o.value===atual))s.value=atual;});}
function abrirNovoColaboradorRH(){['rhColaboradorNome','rhColaboradorCargo','rhColaboradorTelefone','rhColaboradorEmail','rhColaboradorAdmissao'].forEach(id=>document.getElementById(id).value='');document.getElementById('rhColaboradorStatus').value='ATIVO';abrirModalRH('modalColaboradorRH');}
function salvarNovoColaboradorRH(){const d={nome:valor('rhColaboradorNome'),cargo:valor('rhColaboradorCargo'),telefone:valor('rhColaboradorTelefone'),email:valor('rhColaboradorEmail'),dataAdmissao:valor('rhColaboradorAdmissao'),status:valor('rhColaboradorStatus')};salvarRH('botaoSalvarColaboradorRH',e=>e.salvarColaboradorRH(d),r=>{fecharModalRH('modalColaboradorRH');mostrarMensagem(`${r.mensagem} ID: ${r.idColaborador}.`,'sucesso');carregarColaboradoresRH();},'mensagemColaboradorRH');}
function agendarBuscaDocumentoRH(){clearTimeout(tDocRH);tDocRH=setTimeout(carregarDocumentosRH,350)}
function carregarDocumentosRH(){google.script.run.withSuccessHandler(renderDocumentosRH).withFailureHandler(exibirErro).listarDocumentosRH({idColaborador:valor('filtroColaboradorDocumentoRH'),tipoDocumento:valor('filtroTipoDocumentoRH'),termo:valor('filtroTermoDocumentoRH')});}
function renderDocumentosRH(l){l=Array.isArray(l)?l:[];docsRH=l;definirTextoRH('quantidadeDocumentosRH',`${l.length} documento${l.length===1?'':'s'}`);document.getElementById('corpoTabelaDocumentosRH').innerHTML=l.length?l.map(x=>`<tr><td><strong>${escapar(x.nomeColaborador)}</strong></td><td>${escapar(x.tipoDocumento)}<small class="dado-rh-secundario">${escapar(x.observacao||'')}</small></td><td>${escapar(x.dataDocumento||'—')}<small class="dado-rh-secundario">Validade: ${escapar(x.validade||'—')}</small></td><td>${escapar(x.nomeArquivo)}</td><td>${escapar(x.dataUpload)}</td><td>${acoesRH(x.urlVisualizacao,x.urlDownload,`excluirDocumentoRH('${escaparAtributo(x.idDocumento)}')`,`abrirEdicaoDocumentoRH('${escaparAtributo(x.idDocumento)}')`)}</td></tr>`).join(''):`<tr><td colspan="6" class="estado-vazio">Nenhum documento encontrado.</td></tr>`;}
function abrirNovoDocumentoRH(){['rhDocumentoData','rhDocumentoValidade','rhDocumentoObservacao','rhDocumentoArquivo'].forEach(id=>document.getElementById(id).value='');document.getElementById('rhDocumentoColaborador').value='';document.getElementById('rhDocumentoTipo').value='';limparPreviewRH('previewDocumentoRH');abrirModalRH('modalDocumentoRH');}
function salvarNovoDocumentoRH(){lerArquivoRH('rhDocumentoArquivo',a=>{const d={idColaborador:valor('rhDocumentoColaborador'),tipoDocumento:valor('rhDocumentoTipo'),dataDocumento:valor('rhDocumentoData'),validade:valor('rhDocumentoValidade'),observacao:valor('rhDocumentoObservacao'),arquivo:a};salvarRH('botaoSalvarDocumentoRH',e=>e.salvarDocumentoRH(d),r=>{fecharModalRH('modalDocumentoRH');mostrarMensagem(`${r.mensagem} ID: ${r.idDocumento}.`,'sucesso');carregarDocumentosRH();},'mensagemDocumentoRH');},m=>msgRH('mensagemDocumentoRH',m));}
function abrirEdicaoDocumentoRH(id){const x=docsRH.find(d=>d.idDocumento===String(id));if(!x){mostrarMensagem('Documento não encontrado. Atualize a lista e tente novamente.','erro');return;}esconderMsgRH('mensagemEdicaoDocumentoRH');document.getElementById('rhEdicaoDocumentoId').value=x.idDocumento;definirValorSelectRH('rhEdicaoDocumentoColaborador',x.idColaborador,x.nomeColaborador);definirValorSelectRH('rhEdicaoDocumentoTipo',x.tipoDocumento,x.tipoDocumento);document.getElementById('rhEdicaoDocumentoData').value=paraInputDataRH(x.dataDocumento);document.getElementById('rhEdicaoDocumentoValidade').value=paraInputDataRH(x.validade);document.getElementById('rhEdicaoDocumentoObservacao').value=x.observacao||'';document.getElementById('rhEdicaoDocumentoArquivo').value='';document.getElementById('rhEdicaoDocumentoArquivoAtual').innerHTML=`<strong>${escapar(x.nomeArquivo||'—')}</strong><span>Enviado em ${escapar(x.dataUpload||'—')}</span>`;limparPreviewRH('previewEdicaoDocumentoRH');abrirModalRH('modalEdicaoDocumentoRH');}
function salvarEdicaoDocumentoRH(){lerArquivoOpcionalRH('rhEdicaoDocumentoArquivo',a=>{const d={idDocumento:valor('rhEdicaoDocumentoId'),idColaborador:valor('rhEdicaoDocumentoColaborador'),tipoDocumento:valor('rhEdicaoDocumentoTipo'),dataDocumento:valor('rhEdicaoDocumentoData'),validade:valor('rhEdicaoDocumentoValidade'),observacao:valor('rhEdicaoDocumentoObservacao')};if(a)d.arquivo=a;salvarRH('botaoSalvarEdicaoDocumentoRH',e=>e.atualizarDocumentoRH(d),r=>{fecharModalRH('modalEdicaoDocumentoRH');mostrarMensagem(r.mensagem,'sucesso');carregarDocumentosRH();},'mensagemEdicaoDocumentoRH');},m=>msgRH('mensagemEdicaoDocumentoRH',m));}
function excluirDocumentoRH(id){if(!confirm('Excluir documento e enviar arquivo para a lixeira?'))return;google.script.run.withSuccessHandler(r=>{mostrarMensagem(r.mensagem,'sucesso');carregarDocumentosRH();}).withFailureHandler(exibirErro).excluirDocumentoRH(id);}
function agendarBuscaFolhaRH(){clearTimeout(tFolhaRH);tFolhaRH=setTimeout(carregarFolhasPontoRH,350)}
function carregarFolhasPontoRH(){google.script.run.withSuccessHandler(renderFolhasRH).withFailureHandler(exibirErro).listarFolhasPontoRH({idColaborador:valor('filtroColaboradorFolhaRH'),competencia:valor('filtroCompetenciaFolhaRH'),termo:valor('filtroTermoFolhaRH')});}
function renderFolhasRH(l){l=Array.isArray(l)?l:[];definirTextoRH('quantidadeFolhasRH',`${l.length} folha${l.length===1?'':'s'}`);document.getElementById('corpoTabelaFolhasRH').innerHTML=l.length?l.map(x=>`<tr><td><strong>${escapar(x.nomeColaborador)}</strong></td><td>${formatarCompetenciaRH(x.competencia)}</td><td>${escapar(x.nomeArquivo)}</td><td>${escapar(x.dataUpload)}</td><td>${escapar(x.observacao||'—')}</td><td>${acoesRH(x.urlVisualizacao,x.urlDownload,`excluirFolhaPontoRH('${escaparAtributo(x.idFolha)}')`)}</td></tr>`).join(''):`<tr><td colspan="6" class="estado-vazio">Nenhuma folha encontrada.</td></tr>`;}
function abrirNovaFolhaPontoRH(){['rhFolhaCompetencia','rhFolhaObservacao','rhFolhaArquivo'].forEach(id=>document.getElementById(id).value='');document.getElementById('rhFolhaColaborador').value='';limparPreviewRH('previewFolhaRH');abrirModalRH('modalFolhaRH');}
function salvarNovaFolhaPontoRH(){lerArquivoRH('rhFolhaArquivo',a=>{const d={idColaborador:valor('rhFolhaColaborador'),competencia:valor('rhFolhaCompetencia'),observacao:valor('rhFolhaObservacao'),arquivo:a};salvarRH('botaoSalvarFolhaRH',e=>e.salvarFolhaPontoRH(d),r=>{fecharModalRH('modalFolhaRH');mostrarMensagem(`${r.mensagem} ID: ${r.idFolha}.`,'sucesso');carregarFolhasPontoRH();},'mensagemFolhaRH');},m=>msgRH('mensagemFolhaRH',m));}
function excluirFolhaPontoRH(id){if(!confirm('Excluir folha e enviar arquivo para a lixeira?'))return;google.script.run.withSuccessHandler(r=>{mostrarMensagem(r.mensagem,'sucesso');carregarFolhasPontoRH();}).withFailureHandler(exibirErro).excluirFolhaPontoRH(id);}
function abrirModalRH(id){document.getElementById(id).classList.remove('oculto');document.body.style.overflow='hidden'}
function fecharModalRH(id){document.getElementById(id).classList.add('oculto');document.body.style.overflow=''}
function fecharModalRHFora(e,id){if(e.target.id===id)fecharModalRH(id)}
function visualizarArquivoRH(input,id){const a=input.files&&input.files[0];if(!a)return;if(a.size>15*1024*1024){input.value='';alert('Máximo de 15 MB.');return;}const p=document.getElementById(id);p.innerHTML=`<strong>${escapar(a.name)}</strong><span>${(a.size/1024/1024).toFixed(2)} MB</span>`;p.classList.remove('oculto');}
function lerArquivoRH(id,sucesso,falha){const i=document.getElementById(id),a=i.files&&i.files[0];if(!a){falha('Selecione um arquivo.');return;}const r=new FileReader();r.onload=e=>sucesso({nome:a.name,tipo:a.type||'application/octet-stream',base64:String(e.target.result).split(',')[1]});r.onerror=()=>falha('Não foi possível ler o arquivo.');r.readAsDataURL(a);}
function lerArquivoOpcionalRH(id,sucesso,falha){const i=document.getElementById(id),a=i.files&&i.files[0];if(!a){sucesso(null);return;}const r=new FileReader();r.onload=e=>sucesso({nome:a.name,tipo:a.type||'application/octet-stream',base64:String(e.target.result).split(',')[1]});r.onerror=()=>falha('Não foi possível ler o arquivo.');r.readAsDataURL(a);}
function salvarRH(idBotao,executar,sucesso,idMsg){const b=document.getElementById(idBotao),t=b.textContent;b.disabled=true;b.textContent='Salvando...';const e=google.script.run.withSuccessHandler(r=>{b.disabled=false;b.textContent=t;sucesso(r)}).withFailureHandler(err=>{b.disabled=false;b.textContent=t;msgRH(idMsg,err&&err.message?err.message:String(err||'Erro.'))});executar(e);}
function acoesRH(v,d,e,ed){return `<div class="acoes-arquivo-rh">${ed?`<button class="botao botao-secundario botao-rh-pequeno" onclick="${ed}">Editar</button>`:''}<a class="botao botao-secundario botao-rh-pequeno" target="_blank" href="${escaparAtributo(v)}">Visualizar</a><a class="botao botao-primario botao-rh-pequeno" target="_blank" href="${escaparAtributo(d)}">Baixar</a><button class="botao botao-perigo botao-rh-pequeno" onclick="${e}">Excluir</button></div>`}
function limparPreviewRH(id){const p=document.getElementById(id);p.innerHTML='';p.classList.add('oculto')}
function msgRH(id,t){const m=document.getElementById(id);m.textContent=t;m.className='mensagem mensagem-erro';m.classList.remove('oculto')}
function esconderMsgRH(id){const m=document.getElementById(id);if(m){m.textContent='';m.className='mensagem oculto'}}
function definirValorSelectRH(id,v,rotulo){const s=document.getElementById(id);if(!s)return;const alvo=String(v||'');s.value=alvo;if(s.value===alvo||!alvo)return;const o=document.createElement('option');o.value=alvo;o.textContent=rotulo||alvo;s.appendChild(o);s.value=alvo;}
function paraInputDataRH(v){const m=String(v||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:''}
function definirTextoRH(id,t){const e=document.getElementById(id);if(e)e.textContent=t}
function formatarCompetenciaRH(v){return /^\d{4}-\d{2}$/.test(v)?v.slice(5,7)+'/'+v.slice(0,4):v}
</script>
