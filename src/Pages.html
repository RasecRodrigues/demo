function resetarRolagemPrincipalSIGA() {
  const elementosComRolagem = [
    document.scrollingElement,
    document.documentElement,
    document.body,
    document.querySelector('.conteudo'),
    document.querySelector('main.pagina')
  ].filter(Boolean);

  elementosComRolagem.forEach(elemento => {
    elemento.scrollTop = 0;
    elemento.scrollLeft = 0;
  });

  window.scrollTo(0, 0);

  requestAnimationFrame(() => {
    elementosComRolagem.forEach(elemento => {
      elemento.scrollTop = 0;
      elemento.scrollLeft = 0;
    });

    window.scrollTo(0, 0);
  });
}

function tratarEnterBuscaMatriculas(evento) {
  if (evento.key !== 'Enter') return;

  evento.preventDefault();
  pesquisarAlunosParaMatriculas();
}


function agendarBuscaMatriculas() {
  clearTimeout(timerBuscaMatriculas);

  const termo = valor('buscaMatriculas');
  const container =
    document.getElementById('resultadosPesquisaMatriculas');

  const quantidade =
    document.getElementById('quantidadeResultadosMatriculas');

  if (termo.length < 2) {
    if (quantidade) quantidade.textContent = '';

    if (container) {
      container.innerHTML = `
        <div class="estado-vazio">
          Digite pelo menos 2 caracteres para pesquisar.
        </div>
      `;
    }

    return;
  }

  if (container) {
    container.innerHTML = `
      <div class="estado-vazio">Pesquisando...</div>
    `;
  }

  timerBuscaMatriculas = setTimeout(
    pesquisarAlunosParaMatriculas,
    120
  );
}


function carregarBaseBuscaMatriculasSIGA() {
  if (Array.isArray(baseBuscaMatriculasSIGA) || carregandoBaseBuscaMatriculasSIGA) return;
  carregandoBaseBuscaMatriculasSIGA = true;

  google.script.run
    .withSuccessHandler(alunos => {
      clearTimeout(timeoutBaseBuscaMatriculasSIGA);
      baseBuscaMatriculasSIGA = Array.isArray(alunos) ? alunos : [];
      carregandoBaseBuscaMatriculasSIGA = false;

      const termo = valor('buscaMatriculas');
      if (termo.length >= 2) pesquisarAlunosParaMatriculas();

      const termoGlobal = valor('buscaGlobal');
      if (termoGlobal.length >= 2) {
        ultimaBuscaExecutada = termoGlobal;
        ultimoTermoPesquisado = termoGlobal;
        mostrarResultados(
          filtrarBaseMatriculasLocalSIGA(termoGlobal)
        );
      }
    })
    .withFailureHandler(erro => {
      clearTimeout(timeoutBaseBuscaMatriculasSIGA);
      carregandoBaseBuscaMatriculasSIGA = false;
      baseBuscaMatriculasSIGA = null;

      const termoGlobal = valor('buscaGlobal');
      if (termoGlobal.length >= 2) {
        pesquisarAlunosServidorFallbackSIGA(termoGlobal);
      }

      const termoMatriculas = valor('buscaMatriculas');
      if (termoMatriculas.length >= 2) {
        google.script.run
          .withSuccessHandler(renderizarResultadosMatriculas)
          .withFailureHandler(exibirErro)
          .pesquisarAlunos(termoMatriculas);
      }
    })
    .listarBasePesquisaMatriculasRapidaSIGA();

  timeoutBaseBuscaMatriculasSIGA = setTimeout(() => {
    if (!carregandoBaseBuscaMatriculasSIGA) return;
    carregandoBaseBuscaMatriculasSIGA = false;
    const termoGlobal = valor('buscaGlobal');
    if (termoGlobal.length >= 2) pesquisarAlunosServidorFallbackSIGA(termoGlobal);
  }, 8000);
}


function pesquisarAlunosServidorFallbackSIGA(termo) {
  google.script.run
    .withSuccessHandler(resultado => {
      if (valor('buscaGlobal') !== termo) return;
      mostrarResultados(Array.isArray(resultado) ? resultado : []);
    })
    .withFailureHandler(erro => {
      ultimaBuscaExecutada = '';
      const container = document.getElementById('resultadosAlunos');
      if (container) {
        container.innerHTML = `
          <div class="estado-vazio">
            Não foi possível pesquisar: ${escapar(erro?.message || String(erro || 'erro desconhecido'))}
          </div>
        `;
      }
    })
    .pesquisarAlunos(termo);
}


function normalizarBuscaMatriculasSIGA(valorBusca) {
  return String(valorBusca || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .replace(/\s+/g, ' ')
    .trim();
}


function filtrarBaseMatriculasLocalSIGA(termo) {
  const texto = normalizarBuscaMatriculasSIGA(termo);
  const numeros = String(termo || '').replace(/\D/g, '');

  return (baseBuscaMatriculasSIGA || [])
    .filter(aluno => {
      const alvoTexto = normalizarBuscaMatriculasSIGA([
        aluno.idAluno,
        aluno.nomeAluno,
        aluno.nomeSocial
      ].join(' '));

      const alvoNumeros = [
        aluno.cpf,
        aluno.telefoneAluno,
        aluno.telefoneResponsavel
      ].join(' ').replace(/\D/g, '');

      return (
        (texto && alvoTexto.includes(texto)) ||
        (numeros.length >= 3 && alvoNumeros.includes(numeros))
      );
    })
    .slice(0, 50);
}


function pesquisarAlunosParaMatriculas() {
  const termo = valor('buscaMatriculas');

  if (termo.length < 2) {
    return;
  }

  if (Array.isArray(baseBuscaMatriculasSIGA)) {
    renderizarResultadosMatriculas(
      filtrarBaseMatriculasLocalSIGA(termo)
    );
    return;
  }

  carregarBaseBuscaMatriculasSIGA();

  google.script.run
    .withSuccessHandler(renderizarResultadosMatriculas)
    .withFailureHandler(exibirErro)
    .pesquisarAlunos(termo);
}


function renderizarResultadosMatriculas(alunos) {
  const container =
    document.getElementById('resultadosPesquisaMatriculas');

  const quantidade =
    document.getElementById('quantidadeResultadosMatriculas');

  if (!container) return;

  const lista = Array.isArray(alunos) ? alunos : [];

  if (quantidade) {
    quantidade.textContent =
      `${lista.length} resultado${lista.length === 1 ? '' : 's'}`;
  }

  if (!lista.length) {
    container.innerHTML = `
      <div class="estado-vazio">
        Nenhum aluno cadastrado foi encontrado.
      </div>
    `;
    return;
  }

  container.innerHTML = lista.map(aluno => `
    <div class="resultado-aluno">
      <div>
        <div class="nome-aluno">${escapar(aluno.nomeAluno)}</div>
        <div class="id-aluno">${escapar(aluno.idAluno)}</div>
      </div>

      <div>
        <div class="dado-secundario">CPF</div>
        <div>${escapar(aluno.cpf || 'Não informado')}</div>
      </div>

      <div class="ocultar-tablet">
        <div class="dado-secundario">Telefone</div>
        <div>${escapar(aluno.telefoneAluno || 'Não informado')}</div>
      </div>

      <div></div>

      <button
        type="button"
        class="botao botao-primario"
        onclick="abrirGestaoMatriculasAluno(
          '${escaparAtributo(aluno.idAluno)}'
        )"
      >
        Gerenciar matrículas
      </button>
    </div>
  `).join('');
}


function abrirGestaoMatriculasAluno(idAluno) {
  idAlunoAberto = idAluno;
  origemGestaoMatricula = 'MATRICULAS';

  const cardPesquisa =
    document.getElementById('resultadoPesquisaMatriculasCard');

  const gestao =
    document.getElementById('gestaoMatriculasAluno');

  if (cardPesquisa) cardPesquisa.classList.add('oculto');
  if (gestao) gestao.classList.remove('oculto');

  const alunoLocal = Array.isArray(baseBuscaMatriculasSIGA)
    ? baseBuscaMatriculasSIGA.find(item => String(item.idAluno || '') === String(idAluno || ''))
    : null;

  document.getElementById('nomeAlunoGestaoMatriculas').textContent =
    alunoLocal?.nomeAluno || 'Carregando aluno...';

  document.getElementById('dadosAlunoGestaoMatriculas').textContent =
    alunoLocal
      ? `${idAluno} · CPF: ${alunoLocal.cpf || 'não informado'}`
      : idAluno;

  document.getElementById('listaGestaoMatriculas').innerHTML = `
    <div class="estado-vazio">Carregando matrículas...</div>
  `;

  let consultaFinalizada = false;
  const limiteEspera = setTimeout(() => {
    if (consultaFinalizada) return;
    const lista = document.getElementById('listaGestaoMatriculas');
    if (lista) {
      lista.innerHTML = `
        <div class="estado-vazio">
          A consulta demorou mais que o esperado.
          <br>
          <button type="button" class="botao botao-primario" style="margin-top:12px" onclick="abrirGestaoMatriculasAluno('${escaparAtributo(idAluno)}')">
            Tentar novamente
          </button>
        </div>
      `;
    }
  }, 12000);

  google.script.run
    .withSuccessHandler(resultado => {
      consultaFinalizada = true;
      clearTimeout(limiteEspera);
      const aluno = resultado?.aluno || alunoLocal || {};
      nomeAlunoAberto = aluno.nomeAluno || '';
      document.getElementById('nomeAlunoGestaoMatriculas').textContent =
        aluno.nomeAluno || 'Aluno';
      document.getElementById('dadosAlunoGestaoMatriculas').textContent =
        `${aluno.idAluno || idAluno} · CPF: ${aluno.cpf || 'não informado'}`;
      renderizarGestaoMatriculas(
        Array.isArray(resultado?.matriculas) ? resultado.matriculas : []
      );
    })
    .withFailureHandler(erro => {
      consultaFinalizada = true;
      clearTimeout(limiteEspera);
      const lista = document.getElementById('listaGestaoMatriculas');
      if (lista) {
        lista.innerHTML = '<div class="estado-vazio">Não foi possível carregar as matrículas.</div>';
      }
      exibirErro(erro);
    })
    .obterFichaAlunoCompletaSIGAV4(idAluno);
}



function obterConfiguracaoStatusMatricula(statusInformado) {
  const status = String(statusInformado || '')
    .trim()
    .toUpperCase();

  const encerrados = [
    'CANCELADO',
    'CANCELADA',
    'FINALIZADO',
    'FINALIZADA',
    'ABANDONO',
    'INATIVO',
    'INATIVA',
    'TURMA ENCERRADA'
  ];

  if (status === 'ATIVO' || status === 'ATIVA') {
    return {
      status,
      encerrada: false,
      classeStatus: 'status-ativo',
      classeCartao: 'matricula-card-ativo'
    };
  }

  if (status === 'EM ESPERA') {
    return {
      status,
      encerrada: false,
      classeStatus: 'status-espera',
      classeCartao: 'matricula-card-espera'
    };
  }

  if (status === 'SUSPENSO' || status === 'SUSPENSA') {
    return {
      status,
      encerrada: false,
      classeStatus: 'status-suspenso',
      classeCartao: 'matricula-card-suspenso'
    };
  }

  if (status === 'CANCELADO' || status === 'CANCELADA') {
    return {
      status,
      encerrada: true,
      classeStatus: 'status-cancelado',
      classeCartao: 'matricula-card-cancelado'
    };
  }

  if (status === 'FINALIZADO' || status === 'FINALIZADA') {
    return {
      status,
      encerrada: true,
      classeStatus: 'status-finalizado',
      classeCartao: 'matricula-card-finalizado'
    };
  }

  if (status === 'ABANDONO') {
    return {
      status,
      encerrada: true,
      classeStatus: 'status-abandono',
      classeCartao: 'matricula-card-abandono'
    };
  }

  return {
    status,
    encerrada: encerrados.includes(status),
    classeStatus: 'status-outro',
    classeCartao: 'matricula-card-outro'
  };
}


function gerarLinhaTempoMatricula(matricula) {
  const eventos = [];

  const tipo = String(matricula.tipoMatricula || '')
    .trim()
    .toUpperCase();

  const tituloCadastro =
    tipo === 'UPGRADE'
      ? 'Upgrade registrado'
      : tipo === 'RENOVAÇÃO'
        ? 'Renovação registrada'
        : tipo === 'TRANSFERÊNCIA'
          ? 'Transferência registrada'
          : tipo === 'ATIVAÇÃO'
            ? 'Ativação registrada'
            : tipo === 'MUDANÇA APPAI'
              ? 'Mudança APPAI registrada'
              : 'Matrícula registrada';

  if (matricula.dataMatricula) {
    eventos.push({
      data: matricula.dataMatricula,
      dataOrdenacao: matricula.dataMatriculaHtml || '',
      titulo: tituloCadastro,
      detalhe:
        matricula.motivoAlteracao ||
        matricula.tipoMatricula ||
        ''
    });
  }

  if (matricula.dataEfetivoTurma) {
    eventos.push({
      data: matricula.dataEfetivoTurma,
      dataOrdenacao: matricula.dataEfetivoTurmaHtml || '',
      titulo: 'Início efetivo na turma',
      detalhe: matricula.turma || ''
    });
  }

  if (matricula.dataCancelamento) {
    const status = String(matricula.status || '')
      .trim()
      .toUpperCase();

    eventos.push({
      data: matricula.dataCancelamento,
      dataOrdenacao: matricula.dataCancelamentoHtml || '',
      titulo:
        status === 'FINALIZADO' || status === 'FINALIZADA'
          ? 'Matrícula finalizada'
          : status === 'ABANDONO'
            ? 'Abandono registrado'
            : 'Matrícula cancelada',
      detalhe: ''
    });
  }

  if (!eventos.length) {
    return '';
  }

  eventos.sort((a, b) =>
    String(a.dataOrdenacao || '').localeCompare(
      String(b.dataOrdenacao || '')
    )
  );

  return `
    <div class="linha-tempo-matricula">
      <div class="linha-tempo-titulo">
        Histórico da matrícula
      </div>

      ${eventos.map(evento => `
        <div class="linha-tempo-item">
          <div class="linha-tempo-marcador"></div>

          <div class="linha-tempo-conteudo">
            <time>${escapar(evento.data)}</time>
            <strong>${escapar(evento.titulo)}</strong>

            ${
              evento.detalhe
                ? `<span>${escapar(evento.detalhe)}</span>`
                : ''
            }
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function gerarBeneficiosMatriculaSIGA(matricula) {
  const appaiTexto =
    normalizarBuscaMatriculasSIGA(
      matricula.appai || ''
    );

  const ehAppai =
    ['SIM','S','APPAI','ATIVO','ATIVA']
      .includes(appaiTexto);

  const percentualBolsa =
    percentualBolsaTelaSIGA_(
      matricula.bolsista
    );

  const bolsistaTexto =
    percentualBolsa === ''
      ? 'Não'
      : `${Number(percentualBolsa)
          .toLocaleString(
            'pt-BR',
            { maximumFractionDigits: 2 }
          )}%`;

  const isentoTexto =
    String(
      matricula.isentoMatricula || 'NÃO'
    ).trim() || 'NÃO';


  /* ==============================
     VALORES BASE DA MATRÍCULA
     ============================== */

  const semComboAntes =
    Number(
      matricula.semComboAntes || 0
    );

  const semComboDepois =
    Number(
      matricula.semComboDepois || 0
    );

  const comComboAntes =
    Number(
      matricula.comComboAntes || 0
    );

  const comComboDepois =
    Number(
      matricula.comComboDepois || 0
    );


  /*
   * Por enquanto, a ficha exibe como referência principal
   * o valor SEM COMBO antes do vencimento.
   *
   * Os demais valores ficam identificados abaixo.
   */

  /*
   * A BOLSA NÃO É APLICADA AQUI — e não é esquecimento.
   *
   * As colunas SEM_COMBO_* e COM_COMBO_* da DimMatricula já vêm com o
   * desconto embutido: quem cadastra digita o valor que o aluno paga de
   * verdade. Multiplicar por (1 - bolsa/100) na exibição descontava uma
   * segunda vez, e a ficha prometia um valor menor do que o boleto ia
   * cobrar — 22% de bolsa mostrava R$ 140,40 numa mensalidade de R$ 180.
   *
   * A única exceção é a isenção total, porque ela não está nas colunas de
   * valor: calcularValorMatriculaPagUnifV38_ devolve 0 quando a matrícula
   * é APPAI ou bolsa de 100%, independentemente do que estiver ali. Aqui
   * a ficha repete essa mesma regra, e só ela.
   */
  const isentoDeMensalidade =
    ehAppai ||
    Number(percentualBolsa) === 100;

  const valorPrincipal =
    isentoDeMensalidade
      ? 0
      : semComboAntes;


  const moeda = valor =>
    Number(valor || 0)
      .toLocaleString(
        'pt-BR',
        {
          style: 'currency',
          currency: 'BRL'
        }
      );


  // Isento não tem "após vencimento" nem "combo": o valor é zero em
  // qualquer um deles.
  const detalhesValores = [];

  if (
    !isentoDeMensalidade &&
    semComboDepois > 0 &&
    semComboDepois !== semComboAntes
  ) {
    detalhesValores.push(
      `Após vencimento: ${moeda(semComboDepois)}`
    );
  }

  if (
    !isentoDeMensalidade &&
    comComboAntes > 0 &&
    comComboAntes !== semComboAntes
  ) {
    detalhesValores.push(
      `Combo: ${moeda(comComboAntes)}`
    );
  }

  if (
    !isentoDeMensalidade &&
    comComboDepois > 0 &&
    comComboDepois !== comComboAntes
  ) {
    detalhesValores.push(
      `Combo após vencimento: ${moeda(comComboDepois)}`
    );
  }


  return `
    <div class="matricula-beneficios-siga">

      <div class="matricula-beneficio ${
        ehAppai
          ? 'beneficio-sim'
          : 'beneficio-nao'
      }">
        <span>APPAI</span>

        <strong>
          ${ehAppai ? 'Sim' : 'Não'}
        </strong>
      </div>


      <div class="matricula-beneficio">
        <span>Bolsista</span>

        <strong>
          ${escapar(bolsistaTexto)}
        </strong>
      </div>


      <div class="matricula-beneficio">
        <span>Isento de matrícula</span>

        <strong>
          ${escapar(isentoTexto)}
        </strong>
      </div>


      <div class="matricula-beneficio">
        <span>Mensalidade</span>

        <strong>
          ${
            isentoDeMensalidade
              ? moeda(0)
              : (valorPrincipal > 0
                  ? moeda(valorPrincipal)
                  : 'Não informado')
          }
        </strong>

        ${
          detalhesValores.length
            ? `
              <small
                style="
                  display:block;
                  margin-top:5px;
                  color:#667085;
                  font-size:10px;
                  line-height:1.45;
                "
              >
                ${detalhesValores
                  .map(escapar)
                  .join('<br>')}
              </small>
            `
            : ''
        }
      </div>

    </div>
  `;
}

function salvarNovaMatricula() {
  // Mesmo motivo de salvarNovoAluno: o aviso da tentativa anterior
  // sobrevive à correção do campo.
  const avisoAnterior =
    document.getElementById('mensagemNovaMatricula');

  if (avisoAnterior) {
    avisoAnterior.textContent = '';
    avisoAnterior.classList.add('oculto');
  }

  const modo = valor('modoFormularioMatricula') || 'NOVO';

  const dados = {
    idMatricula: valor('idMatriculaEdicao'),
    idAluno: idAlunoAberto,
    nomeAluno:
      nomeAlunoAberto ||
      valor('nomeAluno') ||
      document.getElementById('nomeAlunoGestaoMatriculas')?.textContent ||
      '',
    turma: valor('matriculaTurma'),
    modalidade: valor('matriculaModalidade'),
    appai: valor('matriculaAppai'),
    motivoAlteracao: valor('matriculaMotivoAlteracao'),
    dataMatricula: valor('matriculaData'),
    dataEfetivoTurma: valor('matriculaDataEfetivoTurma'),
    status: valor('matriculaStatus'),
    tipoMatricula: valor('matriculaTipo'),
    isentoMatricula: valor('matriculaIsento'),
    bolsista: valorBolsistaPlanilhaSIGA_(valor('matriculaBolsista')),
    semComboAntes: valor('matriculaSemComboAntes'),
    semComboDepois: valor('matriculaSemComboDepois'),
    comComboAntes: valor('matriculaComComboAntes'),
    comComboDepois: valor('matriculaComComboDepois')
  };

  const camposObrigatorios = [
    ['idAluno', 'Não foi possível identificar o aluno.'],
    ['nomeAluno', 'Não foi possível identificar o nome do aluno.'],
    ['turma', 'Selecione a turma.'],
    ['modalidade', 'Informe a modalidade.'],
    ['appai', 'Informe se o aluno é APPAI.'],
    ['dataMatricula', 'Informe a data da matrícula.'],
    [
      'dataEfetivoTurma',
      'Informe a data em que o aluno iniciará na turma.'
    ],
    ['status', 'Informe o status da matrícula.'],
    ['tipoMatricula', 'Informe o tipo de matrícula.'],
    [
      'isentoMatricula',
      'Informe se o aluno é isento da matrícula.'
    ],
  ];

  if (modo === 'EDITAR' && !dados.idMatricula) {
    mostrarErroNovaMatricula(
      'Não foi possível identificar a matrícula que será editada.',
      'erro'
    );
    return;
  }

  for (const [campo, mensagem] of camposObrigatorios) {
    if (!dados[campo]) {
      mostrarErroNovaMatricula(mensagem, 'erro');
      return;
    }
  }

  const dataInicioTurma =
    obterDataInicioTurmaSelecionada('matriculaTurma');

  if (
    dataInicioTurma &&
    dados.dataEfetivoTurma &&
    new Date(`${dados.dataEfetivoTurma}T00:00:00`) <
      new Date(`${dataInicioTurma}T00:00:00`)
  ) {
    mostrarErroNovaMatricula(
      'A data em que o aluno iniciará na turma deve ser maior ou igual à data de início da turma.',
      'erro'
    );
    return;
  }

  const botao =
    document.getElementById('botaoSalvarNovaMatricula');

  botao.disabled = true;
  botao.textContent = 'Salvando...';

  const sucesso = resultado => {
    botao.disabled = false;
    botao.textContent =
      modo === 'EDITAR'
        ? 'Salvar alterações'
        : 'Salvar matrícula';

    fecharNovaMatricula();

    mostrarMensagem(
      `${resultado.mensagem}${
        resultado.idMatricula
          ? ` ID: ${resultado.idMatricula}.`
          : ''
      }`,
      'sucesso'
    );

    atualizarListasMatriculasAbertas();
  };

  const falha = erro => {
    botao.disabled = false;
    botao.textContent =
      modo === 'EDITAR'
        ? 'Salvar alterações'
        : 'Salvar matrícula';

    mostrarErroNovaMatricula(
      erro && erro.message
        ? erro.message
        : String(
            erro ||
            'Ocorreu um erro ao salvar a matrícula.'
          ),
      'erro'
    );
  };

  const executor = google.script.run
    .withSuccessHandler(sucesso)
    .withFailureHandler(falha);

  if (modo === 'EDITAR') {
    executor.atualizarMatricula(dados);
  } else {
    executor.cadastrarMatriculaAlunoExistente(dados);
  }
}

      ].join('-');

function converterDataBrParaHtml(data) {
  if (!data) {
    return '';
  }

  if (/^\d{4}-\d{2}-\d{2}$/.test(data)) {
    return data;
  }

  const partes = data.split('/');

  if (partes.length !== 3) {
    return '';
  }

  return `${partes[2]}-${partes[1]}-${partes[0]}`;
}

    function mostrarMensagem(texto, tipo = 'erro') {
  const modais = [
    {
      idModal: 'modalComprovante',
      idMensagem: 'mensagemComprovante'
    },
    {
      idModal: 'modalNovaMatricula',
      idMensagem: 'mensagemNovaMatricula'
    }
  ];

  for (const item of modais) {
    const modal = document.getElementById(item.idModal);

    if (
      !modal ||
      modal.classList.contains('oculto')
    ) {
      continue;
    }

    let mensagem =
      document.getElementById(item.idMensagem);

    if (!mensagem) {
      const corpoModal =
        modal.querySelector('.modal-corpo');

      if (corpoModal) {
        mensagem = document.createElement('div');
        mensagem.id = item.idMensagem;
        mensagem.className = 'mensagem oculto';
        corpoModal.prepend(mensagem);
      }
    }

    if (mensagem) {
      mensagem.textContent = texto;
      mensagem.className =
        `mensagem ${
          tipo === 'sucesso'
            ? 'mensagem-sucesso'
            : 'mensagem-erro'
        }`;

      mensagem.style.position = 'sticky';
      mensagem.style.top = '0';
      mensagem.style.zIndex = '999';
      mensagem.style.marginBottom = '18px';
      mensagem.classList.remove('oculto');

      const janelaModal =
        modal.querySelector('.modal');

      if (janelaModal) {
        janelaModal.scrollTop = 0;
      }

      return;
    }
  }

  const mensagem =
    document.getElementById('mensagem');

  if (!mensagem) {
    alert(texto);
    return;
  }

  mensagem.textContent = texto;
  mensagem.className =
    `mensagem ${
      tipo === 'sucesso'
        ? 'mensagem-sucesso'
        : 'mensagem-erro'
    }`;

  mensagem.classList.remove('oculto');

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

function renderizarTurmasSistema(turmas) {
  const container = document.getElementById('listaTurmasSistema');
  const quantidade = document.getElementById('quantidadeTurmas');

  quantidade.textContent =
    `${turmas.length} turma${turmas.length === 1 ? '' : 's'}`;

  if (!turmas.length) {
    container.innerHTML = `
      <div class="estado-vazio">
        Nenhuma turma encontrada.
      </div>
    `;
    return;
  }

  container.innerHTML = turmas.map(turma => {
    const status = String(turma.statusTurma || '').toUpperCase();

    const classeStatus =
      status === 'EM ANDAMENTO'
        ? 'status-ativo'
        : status === 'ENCERRADA'
          ? 'status-encerrado'
          : 'status-outro';

    const podeEncerrar = status !== 'ENCERRADA';

    return `
  <article class="turma-card">
    <div class="turma-card-conteudo">

      <div class="turma-card-topo">
        <div>
          <h3>${escapar(turma.tipoMatricula)}</h3>

          <div class="turma-resumo-linha">
            ${escapar(turma.dia || '—')}
            (${escapar(turma.hora || '—')})
            · Início ${escapar(turma.dataInicio || '—')}
            · Fim ${escapar(turma.dataFim || '—')}
          </div>
        </div>

        <span class="status ${classeStatus}">
          ${escapar(turma.statusTurma || 'SEM STATUS')}
        </span>
      </div>

    </div>

    <div class="turma-card-acoes">
      <button
        type="button"
        class="botao botao-secundario"
        onclick="abrirEdicaoTurma(
          '${escaparAtributo(turma.tipoMatricula)}'
        )"
      >
        Editar
      </button>

      ${
        podeEncerrar
          ? `
              <button
                type="button"
                class="botao botao-perigo"
                onclick="encerrarTurmaSistema(
                  '${escaparAtributo(turma.tipoMatricula)}'
                )"
              >
                Encerrar
              </button>
            `
          : ''
      }
    </div>
  </article>
`;
  }).join('');
}

function salvarTurmaSistema() {
  const modo = valor('modoFormularioTurma');

  const dados = {
    tipoMatricula: valor('turmaTipoMatricula'),
    modalidade: valor('turmaModalidade'),
    dia: valor('turmaDia'),
    hora: valor('turmaHora'),
    statusTurma: valor('turmaStatus'),
    dataInicio: valor('turmaDataInicio'),
    dataFim: valor('turmaDataFim')
  };

  const obrigatorios = [
    ['tipoMatricula', 'Informe o tipo da turma.'],
    ['modalidade', 'Informe a modalidade.'],
    ['dia', 'Informe o dia da turma.'],
    ['hora', 'Informe o horário da turma.'],
    ['statusTurma', 'Informe o status da turma.'],
    ['dataInicio', 'Informe a data de início.']
  ];

  for (const [campo, mensagem] of obrigatorios) {
    if (!dados[campo]) {
      mostrarMensagem(mensagem, 'erro');
      return;
    }
  }

  if (
    dados.dataFim &&
    dados.dataFim < dados.dataInicio
  ) {
    mostrarMensagem(
      'A data de fim não pode ser anterior à data de início.',
      'erro'
    );
    return;
  }

  const botao = document.getElementById('botaoSalvarTurma');
  botao.disabled = true;
  botao.textContent = 'Salvando...';

  const executor = modo === 'EDICAO'
    ? 'atualizarTurmaGestaoComAtivacaoSIGA'
    : 'cadastrarTurmaGestao';

  google.script.run
    .withSuccessHandler(resultado => {
      botao.disabled = false;
      botao.textContent = 'Salvar turma';

      fecharModalTurma();
      mostrarMensagem(resultado.mensagem, 'sucesso');
      carregarTurmasSistema();
      carregarTurmas();
    })
    .withFailureHandler(erro => {
      botao.disabled = false;
      botao.textContent = 'Salvar turma';
      exibirErro(erro);
    })
    [executor](dados);
}

  const termo = valor('buscaAlunoComprovante');

  if (termo.length < 2) {
    mostrarMensagemComprovante(
      'Digite pelo menos 2 caracteres para pesquisar o aluno.',
      'erro'
    );
    return;
  }

  pesquisarAlunoParaComprovante(termo);
}


function pesquisarAlunoParaComprovante(termo) {
  const container =
    document.getElementById('resultadoBuscaAlunoComprovante');

  if (!container) {
    mostrarMensagemComprovante(
      'A área de resultados da pesquisa não foi encontrada.',
      'erro'
    );
    return;
  }

  container.innerHTML = `
    <div class="estado-vazio">
      Pesquisando aluno...
    </div>
  `;

  const aviso =
    document.getElementById('avisoAlunoNaoEncontrado');

  if (aviso) aviso.classList.add('oculto');

  google.script.run
    .withSuccessHandler(alunos => {
      renderizarResultadosAlunoComprovante(alunos, termo);
    })
    .withFailureHandler(erro => {
      mostrarMensagemComprovante(
        erro && erro.message
          ? erro.message
          : String(erro || 'Não foi possível pesquisar o aluno.'),
        'erro'
      );
    })
    .pesquisarAlunosComprovante(termo);
}


function destacarTermoComprovante(texto, termo) {
  const original = String(texto || '');
  const busca = String(termo || '').trim();

  if (!busca) return escapar(original);

  const seguro = busca.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${seguro})`, 'ig');

  return escapar(original).replace(regex, '<mark>$1</mark>');
}


function renderizarResultadosAlunoComprovante(alunos, termo) {
  const container =
    document.getElementById('resultadoBuscaAlunoComprovante');

  const aviso =
    document.getElementById('avisoAlunoNaoEncontrado');

  if (!Array.isArray(alunos) || !alunos.length) {
    container.innerHTML = '';
    if (aviso) aviso.classList.remove('oculto');
    return;
  }

  if (aviso) aviso.classList.add('oculto');

  container.innerHTML = alunos.map(aluno => `
    <button
      type="button"
      class="resultado-aluno-comprovante"
      onclick="selecionarAlunoComprovante(
        '${escaparAtributo(aluno.idAluno)}'
      )"
    >
      <strong>
        ${destacarTermoComprovante(aluno.nomeAluno, termo)}
      </strong>

      <span>
        ${destacarTermoComprovante(aluno.idAluno, termo)}
      </span>

      <span>
        CPF: ${destacarTermoComprovante(
          aluno.cpf || 'Não informado',
          termo
        )}
      </span>
    </button>
  `).join('');
}


function selecionarAlunoComprovante(idAluno) {

  container.innerHTML = `

      document.getElementById('comprovanteNomeAluno').value =

            <strong>${escapar(resultado.aluno.nomeAluno)}</strong>
            <span>

            </span>

function trocarAlunoComprovante() {
  alunoComp = null;
  matriculasComp = [];
  cardsComp = [];
  seqCardComp = 0;

  document.getElementById('buscaAlunoComprovante').value = '';
  document.getElementById('resultadoBuscaAlunoComprovante').innerHTML = '';

function classeStatusMatriculaComprovante(status) {
  const texto = String(status || '').toUpperCase();

  if (texto === 'ATIVO' || texto === 'ATIVA') {
    return 'status-ativo';
  }

  if (
    [
      'CANCELADO',
      'CANCELADA',
      'FINALIZADO',
      'FINALIZADA',
      'ENCERRADO',
      'ENCERRADA',
      'ABANDONO'
    ].includes(texto)
  ) {
    return 'status-encerrado';
  }

  return 'status-outro';
}


function adicionarCartaoPagamento() {
  if (!alunoComp) {
    mostrarMensagemComprovante(
      'Selecione um aluno antes de adicionar a matrícula.',
      'erro'
    );
    return;
  }

  if (!matriculasComp.length) {
    mostrarMensagemComprovante(
      'Este aluno não possui matrículas cadastradas.',
      'erro'
    );
    return;
  }

  abrirSeletorMultiplasMatriculasComprovante();
}


/**
 * Permite selecionar várias matrículas de uma única vez.
 * Cada matrícula selecionada continua gerando um cartão próprio
 * e, consequentemente, uma linha própria na planilha.
 *
 * Isso mantém a distribuição dos valores correta e evita
 * duplicar o mesmo valor automaticamente em várias matrículas.
 */
function abrirSeletorMultiplasMatriculasComprovante() {

  fecharSeletorMultiplasMatriculasComprovante();

  const usadas =
    new Set(
      cardsComp
        .map(card =>
          String(card.idMatricula || '')
        )
        .filter(Boolean)
    );

  const disponiveis =
    matriculasComp.filter(
      matricula =>
        !usadas.has(
          String(
            matricula.idMatricula || ''
          )
        )
    );

  if (!disponiveis.length) {
    mostrarMensagemComprovante(
      'Todas as matrículas deste aluno já foram adicionadas ao comprovante.',
      'erro'
    );
    return;
  }

  const fundo =
    document.createElement('div');

  fundo.id =
    'modalMultiplasMatriculasComprovante';

  fundo.className =
    'modal-fundo seletor-matriculas-multiplas';

  fundo.onclick = evento => {
    if (evento.target === fundo) {
      fecharSeletorMultiplasMatriculasComprovante();
    }
  };

  const opcoes =
    disponiveis
      .map(matricula => {

        const id =
          String(
            matricula.idMatricula || ''
          );

        const status =
          String(
            matricula.status ||
            'SEM STATUS'
          );

        const tipo =
          String(
            matricula.tipoMatricula ||
            ''
          );

        return `
          <label class="opcao-matricula-multipla">
            <input
              type="checkbox"
              value="${escaparAtributo(id)}"
              class="check-matricula-multipla"
            >

            <span class="opcao-matricula-conteudo">
              <strong>
                ${escapar(
                  matricula.turma ||
                  'Turma não informada'
                )}
              </strong>

              <span>
                ${escapar(status)}
                · ${escapar(id)}
              </span>

              ${
                tipo
                  ? `
                    <span>
                      ${escapar(tipo)}
                    </span>
                  `
                  : ''
              }

              ${
                matricula.dataMatricula
                  ? `
                    <span>
                      Início:
                      ${escapar(
                        matricula.dataMatricula
                      )}
                    </span>
                  `
                  : ''
              }
            </span>
          </label>
        `;
      })
      .join('');

  fundo.innerHTML = `
    <section
      class="modal seletor-matriculas-multiplas-modal"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-cabecalho">
        <div>
          <h2>
            Selecionar matrículas
          </h2>

          <div class="subtitulo">
            Marque uma ou mais matrículas relacionadas a este pagamento.
          </div>
        </div>

        <button
          type="button"
          class="modal-fechar"
          onclick="fecharSeletorMultiplasMatriculasComprovante()"
        >
          ×
        </button>
      </div>

      <div class="modal-corpo">

        <div class="seletor-matriculas-acoes">
          <button
            type="button"
            class="botao botao-secundario"
            onclick="selecionarTodasMatriculasComprovante(true)"
          >
            Selecionar todas
          </button>

          <button
            type="button"
            class="botao botao-secundario"
            onclick="selecionarTodasMatriculasComprovante(false)"
          >
            Limpar seleção
          </button>
        </div>

        <div class="lista-matriculas-multiplas">
          ${opcoes}
        </div>

      </div>

      <div class="modal-rodape">
        <button
          type="button"
          class="botao botao-secundario"
          onclick="fecharSeletorMultiplasMatriculasComprovante()"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="botao botao-primario"
          onclick="confirmarMultiplasMatriculasComprovante()"
        >
          Adicionar selecionadas
        </button>
      </div>
    </section>
  `;

  document.body.appendChild(fundo);

  garantirEstiloSeletorMultiplasMatriculasComprovante();
}


function confirmarMultiplasMatriculasComprovante() {

  const selecionadas =
    Array.from(
      document.querySelectorAll(
        '#modalMultiplasMatriculasComprovante .check-matricula-multipla:checked'
      )
    )
      .map(campo =>
        String(
          campo.value || ''
        )
      )
      .filter(Boolean);

  if (!selecionadas.length) {
    mostrarMensagemComprovante(
      'Selecione pelo menos uma matrícula.',
      'erro'
    );
    return;
  }

  selecionadas.forEach(
    idMatricula => {

      const jaExiste =
        cardsComp.some(
          card =>
            String(
              card.idMatricula || ''
            ) ===
            String(idMatricula)
        );

      if (jaExiste) {
        return;
      }

      cardsComp.push({
        id: ++seqCardComp,
        idMatricula,
        valores: {},
        tiposAtivos: {},
        descricaoOutro: ''
      });
    }
  );

  fecharSeletorMultiplasMatriculasComprovante();

  renderizarCardsComprovanteV2();
}


function selecionarTodasMatriculasComprovante(
  selecionar
) {

  document
    .querySelectorAll(
      '#modalMultiplasMatriculasComprovante .check-matricula-multipla'
    )
    .forEach(campo => {
      campo.checked =
        Boolean(selecionar);
    });
}

function renderizarCardsComprovanteV2() {
  const container = document.getElementById('cartoesPagamento');
  const vazio = document.getElementById('estadoSemCartoesPagamento');

  if (!container) return;

  if (vazio) {
    vazio.classList.toggle('oculto', cardsComp.length > 0);
  }

  container.innerHTML = cardsComp.map(card => {
    const matriculaSelecionada = matriculasComp.find(
      item => String(item.idMatricula) === String(card.idMatricula)
    );

    const opcoes = matriculasComp.map(matricula => `
      <option
        value="${escaparAtributo(matricula.idMatricula)}"
        ${
          String(card.idMatricula) === String(matricula.idMatricula)
            ? 'selected'
            : ''
        }
      >
        ${escapar(matricula.turma)}
        — ${escapar(matricula.status || 'SEM STATUS')}
        — ${escapar(matricula.idMatricula)}
      </option>
    `).join('');

    const identificacao = matriculaSelecionada
      ? `
          <div class="cartao-matricula-identificacao">
            <span class="etiqueta-matricula">
              ${escapar(matriculaSelecionada.idMatricula)}
            </span>

            <span class="etiqueta-matricula ${
              classeStatusMatriculaComprovante(
                matriculaSelecionada.status
              )
            }">
              ${escapar(matriculaSelecionada.status || 'SEM STATUS')}
            </span>

            <span class="etiqueta-matricula">
              ${escapar(
                matriculaSelecionada.tipoMatricula || 'TIPO NÃO INFORMADO'
              )}
            </span>

            ${
              matriculaSelecionada.dataMatricula
                ? `
                    <span class="etiqueta-matricula">
                      Início: ${escapar(
                        matriculaSelecionada.dataMatricula
                      )}
                    </span>
                  `
                : ''
            }
          </div>
        `
      : '';

    const campos = CAMPOS_COMP.map(([chave, label]) => {
      const ativo = Boolean(card.tiposAtivos[chave]);
      const valorAtual = Number(card.valores[chave] || 0);

      return `
        <div class="tipo-pagamento-item ${ativo ? 'ativo' : ''}">
          <label class="tipo-pagamento-controle">
            <input
              type="checkbox"
              ${ativo ? 'checked' : ''}
              onchange="alternarTipoPagamentoComprovante(
                ${card.id},
                '${chave}',
                this.checked
              )"
            >
            <span>${escapar(label)}</span>
          </label>

          <input
            type="text"
            inputmode="decimal"
            placeholder="R$ 0,00"
            ${ativo ? '' : 'disabled'}
            value="${
              ativo && valorAtual > 0
                ? valorAtual.toFixed(2).replace('.', ',')
                : ''
            }"
            oninput="alterarValorComprovanteV2(
              ${card.id},
              '${chave}',
              this.value
            )"
          >
        </div>
      `;
    }).join('');

    return `
      <article class="cartao-pagamento-matricula">
        <div class="cartao-pagamento-cabecalho">
          <div>
            <h4>Pagamento por matrícula</h4>
            <span class="dado-secundario">
              Esta matrícula gerará uma linha na planilha.
            </span>
            ${identificacao}
          </div>

          <button
            type="button"
            class="botao botao-perigo"
            onclick="removerCartaoPagamentoV2(${card.id})"
          >
            Remover
          </button>
        </div>

        <div class="grade">
          <div class="campo campo-total">
            <label>Matrícula relacionada *</label>

            <select
              onchange="alterarMatriculaComprovanteV2(
                ${card.id},
                this.value
              )"
            >
              <option value="">Selecione uma matrícula</option>
              ${opcoes}
            </select>
          </div>

          <div class="tipos-pagamento-grade">
            ${campos}
          </div>

          <div class="campo campo-total ${
            card.tiposAtivos.outro ? '' : 'oculto'
          }">
            <label>Especifique o pagamento “Outro” *</label>

            <input
              type="text"
              value="${escaparAtributo(card.descricaoOutro || '')}"
              placeholder="Descreva o que foi pago"
              oninput="alterarDescricaoOutroComprovanteV2(
                ${card.id},
                this.value
              )"
            >
          </div>
        </div>

        <div class="total-cartao-pagamento">
          <span>Total desta linha</span>

          <strong id="totalCardComp${card.id}">
            ${formatarMoedaComprovanteV2(
              calcularTotalCardComprovanteV2(card)
            )}
          </strong>
        </div>
      </article>
    `;
  }).join('');

  atualizarResumoComprovanteV2();
}


function alterarMatriculaComprovanteV2(id, idMatricula) {
  const card = cardsComp.find(item => item.id === id);

  if (card) {
    card.idMatricula = idMatricula;
    renderizarCardsComprovanteV2();
  }
}


function alternarTipoPagamentoComprovante(id, chave, ativo) {
  const card = cardsComp.find(item => item.id === id);

  if (!card) return;

  card.tiposAtivos[chave] = ativo;

  if (!ativo) {
    card.valores[chave] = 0;

    if (chave === 'outro') {
      card.descricaoOutro = '';
    }
  }

  renderizarCardsComprovanteV2();
}


function alterarValorComprovanteV2(id, chave, valorDigitado) {
  const card = cardsComp.find(item => item.id === id);

  if (!card) return;

  card.valores[chave] =
    converterMoedaNumeroComprovanteV2(valorDigitado);

  const total = document.getElementById(`totalCardComp${id}`);

  if (total) {
    total.textContent = formatarMoedaComprovanteV2(
      calcularTotalCardComprovanteV2(card)
    );
  }

  atualizarResumoComprovanteV2();
}


function alterarDescricaoOutroComprovanteV2(id, descricao) {
  const card = cardsComp.find(item => item.id === id);

  if (card) {
    card.descricaoOutro = String(descricao || '').trim();
  }
}


function removerCartaoPagamentoV2(id) {
  cardsComp = cardsComp.filter(item => item.id !== id);
  renderizarCardsComprovanteV2();
}


function calcularTotalCardComprovanteV2(card) {
  return CAMPOS_COMP.reduce(
    (total, [chave]) =>
      total + Number(card.valores[chave] || 0),
    0
  );
}


function atualizarResumoComprovanteV2() {
  const total = cardsComp.reduce(
    (soma, card) =>
      soma + calcularTotalCardComprovanteV2(card),
    0
  );

  const totalElemento =
    document.getElementById('totalGeralComprovante');

  if (totalElemento) {
    totalElemento.textContent =
      formatarMoedaComprovanteV2(total);
  }

  const linhas =
    document.getElementById('resumoLinhasComprovante');

  if (linhas) {
    linhas.textContent =
      `${cardsComp.length} linha${
        cardsComp.length === 1 ? '' : 's'
      } será${
        cardsComp.length === 1 ? '' : 'ão'
      } gravada${
        cardsComp.length === 1 ? '' : 's'
      }`;
  }

  const forma =
    document.getElementById('resumoFormaComprovante');

  if (forma) {
    forma.textContent =
      `Forma: ${valor('comprovanteFormaPagamento') || 'não informada'}`;
  }

  const periodo =
    document.getElementById('resumoPeriodoComprovante');

  if (periodo) {
    periodo.textContent =
      `Período: ${
        formatarPeriodoComprovanteV2(
          valor('comprovantePeriodo')
        ) || 'não informado'
      }`;
  }
}


function formatarPeriodoComprovanteV2(periodo) {
  const texto = String(periodo || '');

  if (!/^\d{4}-\d{2}$/.test(texto)) {
    return texto;
  }

  const [ano, mes] = texto.split('-');

  return `${mes}/${ano}`;
}


function visualizarArquivoComprovante(input) {
  const preview =
    document.getElementById('previewArquivoComprovante');

  if (!preview) return;

  if (!input.files || !input.files.length) {
    preview.innerHTML = '';
    preview.classList.add('oculto');
    return;
  }

  const arquivo = input.files[0];
  const tamanhoMb = (arquivo.size / 1024 / 1024).toFixed(2);

  if (arquivo.size > 10 * 1024 * 1024) {
    input.value = '';
    preview.innerHTML = '';
    preview.classList.add('oculto');

    mostrarMensagemComprovante(
      'O arquivo deve possuir no máximo 10 MB.',
      'erro'
    );
    return;
  }

  const imagem = arquivo.type.startsWith('image/')
    ? `<img id="imagemPreviewComprovante" alt="Prévia do comprovante">`
    : `<div class="etiqueta-matricula">PDF</div>`;

  preview.innerHTML = `

function salvarComprovantePagamento() {
  esconderMensagemComprovante();

  if (!alunoComp) {
    mostrarMensagemComprovante('Selecione um aluno.', 'erro');
    return;
  }

  const dadosGerais = {
    idAluno: valor('comprovanteIdAluno'),
    nomeAluno: valor('comprovanteNomeAluno'),
    dataPagamento: valor('comprovanteDataPagamento'),
    periodo: valor('comprovantePeriodo'),
    formaPagamento: valor('comprovanteFormaPagamento'),
    observacao: valor('comprovanteObservacao')
  };

  const obrigatorios = [
    ['dataPagamento', 'Informe a data do pagamento.'],
    ['periodo', 'Informe o período de referência.'],
    ['formaPagamento', 'Informe a forma de pagamento.']
  ];

  for (const [campo, mensagem] of obrigatorios) {
    if (!dadosGerais[campo]) {
      mostrarMensagemComprovante(mensagem, 'erro');
      return;
    }
  }

  if (!cardsComp.length) {
    mostrarMensagemComprovante(
      'Adicione ao menos uma matrícula.',
      'erro'
    );
    return;
  }

  const usadas = new Set();

  for (const card of cardsComp) {
    if (!card.idMatricula) {
      mostrarMensagemComprovante(
        'Selecione a matrícula em todos os cartões.',
        'erro'
      );
      return;
    }

    if (usadas.has(card.idMatricula)) {
      mostrarMensagemComprovante(
        'A mesma matrícula não pode aparecer mais de uma vez.',
        'erro'
      );
      return;
    }

    usadas.add(card.idMatricula);

    if (calcularTotalCardComprovanteV2(card) <= 0) {
      mostrarMensagemComprovante(
        'Marque um tipo de pagamento e informe o valor em todos os cartões.',
        'erro'
      );
      return;
    }

    if (
      Number(card.valores.outro || 0) > 0 &&
      !String(card.descricaoOutro || '').trim()
    ) {
      mostrarMensagemComprovante(
        'Descreva o pagamento informado como “Outro”.',
        'erro'
      );
      return;
    }
  }

  const arquivoInput =
    document.getElementById('comprovanteArquivo');

  const enviar = arquivo => {
    enviarComprovantePagamentoV2({
      dadosGerais,
      cartoes: cardsComp,
      arquivo
    });
  };

  if (arquivoInput.files && arquivoInput.files.length) {
    const arquivo = arquivoInput.files[0];
    const leitor = new FileReader();

    leitor.onload = evento => {
      enviar({
        nome: arquivo.name,
        tipo: arquivo.type || 'application/octet-stream',
        base64: String(evento.target.result).split(',')[1]
      });
    };

    leitor.onerror = () => {
      mostrarMensagemComprovante(
        'Não foi possível ler o arquivo selecionado.',
        'erro'
      );
    };

    leitor.readAsDataURL(arquivo);
    return;
  }

  enviar(null);
}


function enviarComprovantePagamentoV2(payload) {
  const botao =
    document.getElementById('botaoSalvarComprovante');

  const progresso =
    document.getElementById('progressoSalvarComprovante');

  if (botao) {
    botao.disabled = true;
    botao.textContent = 'Salvando...';
  }

  if (progresso) {
    progresso.classList.remove('oculto');
  }

  google.script.run
    .withSuccessHandler(resultado => {
      if (botao) {
        botao.disabled = false;
        botao.textContent = 'Salvar comprovante';
      }

      if (progresso) {
        progresso.classList.add('oculto');
      }

      mostrarMensagemComprovante(
        `${resultado.mensagem} ID: ${resultado.idComprovante}.`,
        'sucesso'
      );

      carregarComprovantesRecentes();

      setTimeout(() => {
        fecharModalComprovante();
      }, 1600);
    })
    .withFailureHandler(erro => {
      if (botao) {
        botao.disabled = false;
        botao.textContent = 'Salvar comprovante';
      }

      if (progresso) {
        progresso.classList.add('oculto');
      }

      mostrarMensagemComprovante(
        erro && erro.message
          ? erro.message
          : String(erro || 'Não foi possível salvar o comprovante.'),
        'erro'
      );
    })
    .salvarComprovantePagamento(payload);
}

function converterMoedaNumeroComprovanteV2(valor) {
  let texto = String(valor || '').trim();

  if (!texto) return 0;

  texto = texto
    .replace(/[R$\s]/g, '')
    .replace(/\./g, '')
    .replace(',', '.')
    .replace(/[^\d.-]/g, '');

  const numero = Number(texto);

  return Number.isFinite(numero) && numero > 0
    ? numero
    : 0;
}


function formatarMoedaComprovanteV2(numero) {
  return Number(numero || 0).toLocaleString(
    'pt-BR',
    {
      style: 'currency',
      currency: 'BRL'
    }
  );
}


function mostrarMensagemComprovante(texto, tipo = 'erro') {
  let mensagem =
    document.getElementById('mensagemComprovante');

  const modal =
    document.getElementById('modalComprovante');

  if (!mensagem && modal) {
    const corpo = modal.querySelector('.modal-corpo');

    if (corpo) {
      mensagem = document.createElement('div');
      mensagem.id = 'mensagemComprovante';
      mensagem.className = 'mensagem oculto';
      corpo.prepend(mensagem);
    }
  }

  if (!mensagem) {
    mostrarMensagem(texto, tipo);
    return;
  }

  mensagem.textContent = texto;

  mensagem.className =
    `mensagem ${
      tipo === 'sucesso'
        ? 'mensagem-sucesso'
        : 'mensagem-erro'
    }`;

  mensagem.classList.remove('oculto');

  const caixaModal = modal
    ? modal.querySelector('.modal')
    : null;

  if (caixaModal) {
    caixaModal.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  }
}

function carregarControleChamadasMensal() {

function renderizarControleChamadasMensal(resultado) {
  const resumo = resultado && resultado.resumo
    ? resultado.resumo
    : {};

  const aulas = resultado && Array.isArray(resultado.aulas)
    ? resultado.aulas
    : [];

  definirTextoControle('totalAulasPrevistas', resumo.previstas || 0);
  definirTextoControle('totalChamadasRealizadas', resumo.realizadas || 0);
  definirTextoControle('totalChamadasPendentes', resumo.pendentes || 0);
  definirTextoControle(
    'percentualChamadasRealizadas',
    `${Number(resumo.percentual || 0).toFixed(0)}%`
  );

  definirTextoControle(
    'resumoMesControleChamadas',
    resultado.mesFormatado || ''
  );

  const corpo = document.getElementById('corpoTabelaControleChamadas');

  if (!corpo) {
    return;
  }

  if (!aulas.length) {
    corpo.innerHTML = `
      <tr>
        <td colspan="7" class="estado-vazio">
          Nenhuma aula prevista foi encontrada neste mês.
        </td>
      </tr>
    `;
    return;
  }

  corpo.innerHTML = aulas.map(aula => `
    <tr>
      <td>${escapar(aula.data || '')}</td>
      <td>${escapar(aula.dia || '')}</td>
      <td>${escapar(aula.hora || '—')}</td>
      <td><strong>${escapar(aula.turma || '')}</strong></td>
      <td>${escapar(aula.professor || '—')}</td>
      <td>
        <span class="selo-situacao-chamada ${classeSituacaoChamada(aula.situacao)}">
          ${escapar(rotuloSituacaoChamada(aula.situacao))}
        </span>
      </td>
      <td>${escapar(aula.dataEnvio || '—')}</td>
    </tr>
  `).join('');
}


function definirTextoControle(id, texto) {
  const elemento = document.getElementById(id);

  if (elemento) {
    elemento.textContent = texto;
  }
}


function classeSituacaoChamada(situacao) {
  const valorSituacao = String(situacao || '').toUpperCase();

  if (valorSituacao === 'REALIZADA') {
    return 'situacao-realizada';
  }

  if (valorSituacao === 'FUTURA') {
    return 'situacao-futura';
  }

  return 'situacao-pendente';
}


function rotuloSituacaoChamada(situacao) {
  const valorSituacao = String(situacao || '').toUpperCase();

  if (valorSituacao === 'REALIZADA') {
    return '✓ Realizada';
  }

  if (valorSituacao === 'FUTURA') {
    return 'Aula futura';
  }

  return 'Não realizada';
}

function definirPeriodoPadraoPainelFrequencia() {
  const campoInicial =
    document.getElementById(
      'filtroMesInicialFrequencia'
    );

  const campoFinal =
    document.getElementById(
      'filtroMesFinalFrequencia'
    );

  if (!campoInicial || !campoFinal) {
    return;
  }

  const hoje = new Date();

  if (!campoFinal.value) {
    campoFinal.value = [
      hoje.getFullYear(),
      String(hoje.getMonth() + 1).padStart(2, '0')
    ].join('-');
  }

  if (!campoInicial.value) {
    const inicio = new Date(
      hoje.getFullYear(),
      hoje.getMonth() - 11,
      1
    );

    campoInicial.value = [
      inicio.getFullYear(),
      String(inicio.getMonth() + 1).padStart(2, '0')
    ].join('-');
  }
}


function carregarTurmasPainelFrequencia() {
  const select =
    document.getElementById(
      'filtroTurmaFrequencia'
    );

  if (!select) {
    return;
  }

  if (select.dataset.carregado === 'SIM') {
    return;
  }

  select.innerHTML =
    '<option value="">Carregando turmas...</option>';

  google.script.run
    .withSuccessHandler(turmas => {
      const lista =
        Array.isArray(turmas)
          ? turmas
          : [];

      select.innerHTML =
        '<option value="">Selecione uma turma</option>';

      lista.forEach(item => {
        const turma =
          typeof item === 'string'
            ? item
            : item.turma;

        if (!turma) {
          return;
        }

        const option =
          document.createElement('option');

        option.value = turma;
        option.textContent = turma;

        if (
          item &&
          typeof item === 'object'
        ) {
          option.dataset.dataInicio =
            item.dataInicio || '';

          option.dataset.dataFim =
            item.dataFim || '';

          option.dataset.emAndamento =
            item.emAndamento
              ? 'SIM'
              : 'NAO';
        }

        select.appendChild(option);
      });

      select.dataset.carregado = 'SIM';

      select.onchange =
        aplicarPeriodoTurmaFrequencia;
    })
    .withFailureHandler(exibirErro)
    .listarTurmasPainelFrequencia();
}


function aplicarPeriodoTurmaFrequencia() {
  const select =
    document.getElementById(
      'filtroTurmaFrequencia'
    );

  const campoInicial =
    document.getElementById(
      'filtroMesInicialFrequencia'
    );

  const campoFinal =
    document.getElementById(
      'filtroMesFinalFrequencia'
    );

  if (
    !select ||
    !campoInicial ||
    !campoFinal
  ) {
    return;
  }

  const opcao =
    select.options[
      select.selectedIndex
    ];

  if (!opcao || !opcao.value) {
    return;
  }

  const hoje = new Date();

  const mesAtual = [
    hoje.getFullYear(),
    String(
      hoje.getMonth() + 1
    ).padStart(2, '0')
  ].join('-');

  if (opcao.dataset.dataInicio) {
    campoInicial.value =
      opcao.dataset.dataInicio;
  }

  campoFinal.value =
    opcao.dataset.emAndamento === 'NAO' &&
    opcao.dataset.dataFim
      ? opcao.dataset.dataFim
      : mesAtual;

  carregarPainelFrequenciaAlunos();
}

  }

  if (botao) {

  }

  google.script.run
    .withSuccessHandler(resultado => {
      if (botao) {
        botao.disabled = false;
        botao.textContent = 'Atualizar';
      }

      renderizarPainelFrequenciaAlunos(

    .withFailureHandler(erro => {
      if (botao) {
        botao.disabled = false;
        botao.textContent = 'Atualizar';

      exibirErro(erro);
    })

      turma,
      mesInicial,
      mesFinal
    });
}


function renderizarPainelFrequenciaAlunos(

) {
  const resumo =

      ? resultado.resumo
      : {};

  const alunos =

  );

  );

  );

    resumo
  );

  renderizarTabelaPainelFrequencia(
    alunos
  );

  renderizarGraficoPainelFrequencia(
    alunos
  );
}

function renderizarMiniCardsStatusFrequencia(
  alunos,
  resumo
) {
  garantirEstilosPainelFrequencia();

  const corpoTabela =
    document.getElementById(
      'corpoTabelaPainelFrequencia'
    );

  if (!corpoTabela) {
    return;
  }

  const tabela =
    corpoTabela.closest('table');

  if (!tabela || !tabela.parentElement) {
    return;
  }

  const lista =
    Array.isArray(alunos)
      ? alunos
      : [];

  const total =
    Number(
      resumo &&
      resumo.totalAlunos != null
        ? resumo.totalAlunos
        : lista.length
    );

  const ativos =
    Number(
      resumo &&
      resumo.totalAtivosStatus != null
        ? resumo.totalAtivosStatus
        : 0
    );

  const desligados =
    Number(
      resumo &&
      resumo.totalCanceladosAbandonoStatus != null
        ? resumo.totalCanceladosAbandonoStatus
        : 0
    );

  const finalizados =
    Number(
      resumo &&
      resumo.totalFinalizadosStatus != null
        ? resumo.totalFinalizadosStatus
        : 0
    );

  const mediaFrequencia =
    Number(
      resumo &&
      resumo.mediaFrequencia != null
        ? resumo.mediaFrequencia
        : 0
    );

  const percentualNumero = valor =>
    total > 0
      ? (
          Number(valor || 0) /
          total
        ) * 100
      : 0;

  const percentualTexto = valor =>
    percentualNumero(valor)
      .toLocaleString(
        'pt-BR',
        {
          minimumFractionDigits:1,
          maximumFractionDigits:1
        }
      );

  let container =
    document.getElementById(
      'miniCardsStatusFrequencia'
    );

  if (!container) {
    container =
      document.createElement('div');

    container.id =
      'miniCardsStatusFrequencia';

    tabela.parentElement.insertBefore(
      container,
      tabela
    );
  }

  const cards = [
    {
      titulo:'Total da turma',
      valor:total,
      percentual:100,
      textoPercentual:'100,0% da turma',
      cor:'#4f46e5',
      fundo:'#eef2ff',
      icone:'👥'
    },
    {
      titulo:'Alunos ativos',
      valor:ativos,
      percentual:percentualNumero(ativos),
      textoPercentual:
        `${percentualTexto(ativos)}% da turma`,
      cor:'#16a34a',
      fundo:'#dcfce7',
      icone:'✓'
    },
    {
      titulo:'Desligados',
      valor:desligados,
      percentual:percentualNumero(desligados),
      textoPercentual:
        `${percentualTexto(desligados)}% da turma`,
      cor:'#f97316',
      fundo:'#ffedd5',
      icone:'↘'
    },
    {
      titulo:'Finalizados',
      valor:finalizados,
      percentual:percentualNumero(finalizados),
      textoPercentual:
        `${percentualTexto(finalizados)}% da turma`,
      cor:'#374151',
      fundo:'#e5e7eb',
      icone:'■'
    }
  ];

  container.innerHTML =
    cards.map(card => `
      <article
        class="mini-card-frequencia"
        style="
          --cor-card:${card.cor};
          --fundo-icone:${card.fundo};
        "
      >
        <div class="mini-card-topo-frequencia">
          <span class="mini-card-titulo-frequencia">
            ${escapar(card.titulo)}
          </span>

          <span class="mini-card-icone-frequencia">
            ${card.icone}
          </span>
        </div>

        <strong class="mini-card-valor-frequencia">
          ${Number(card.valor || 0)}
        </strong>

        <small class="mini-card-percentual-frequencia">
          ${escapar(card.textoPercentual)}
        </small>

        <div class="mini-card-barra-frequencia">
          <span
            style="
              width:${Math.min(
                100,
                Math.max(
                  0,
                  Number(card.percentual || 0)
                )
              )}%;
            "
          ></span>
        </div>
      </article>
    `).join('');

  let resumoAutomatico =
    document.getElementById(
      'resumoAutomaticoFrequencia'
    );

  if (!resumoAutomatico) {
    resumoAutomatico =
      document.createElement('div');

    resumoAutomatico.id =
      'resumoAutomaticoFrequencia';

    container.insertAdjacentElement(
      'afterend',
      resumoAutomatico
    );
  }

  resumoAutomatico.innerHTML = `
    <strong>${total} aluno(s)</strong>
    cadastrado(s) na turma:
    <strong>${ativos} ativo(s)</strong>
    (${percentualTexto(ativos)}%),
    <strong>${desligados} desligado(s)</strong>
    (${percentualTexto(desligados)}%) e
    <strong>${finalizados} finalizado(s)</strong>
    (${percentualTexto(finalizados)}%).
    Frequência média:
    <strong>${formatarPercentualPainelFrequencia(
      mediaFrequencia
    )}%</strong>.
  `;
}


function obterClasseStatusAlunoFrequencia(
  statusInformado
) {
  const status =
    String(statusInformado || '')
      .trim()
      .toUpperCase();

  if (
    ['ATIVO', 'ATIVA']
      .includes(status)
  ) {
    return 'status-frequencia-ativo';
  }

  if (
    ['FINALIZADO', 'FINALIZADA']
      .includes(status)
  ) {
    return 'status-frequencia-finalizado';
  }

  if (
    [
      'CANCELADO',
      'CANCELADA',
      'ABANDONO',
      'INATIVO',
      'INATIVA'
    ].includes(status)
  ) {
    return 'status-frequencia-desligado';
  }

  return 'status-frequencia-outro';
}


function renderizarTabelaPainelFrequencia(
  alunos
) {
  garantirEstilosPainelFrequencia();

  const corpo =
    document.getElementById(
      'corpoTabelaPainelFrequencia'
    );

  if (!corpo) {
    return;
  }

  const lista =
    Array.isArray(alunos)
      ? alunos
      : [];

  if (!lista.length) {
    corpo.innerHTML = `
      <tr>
        <td colspan="5" class="estado-vazio">
          Nenhum aluno foi encontrado para essa turma no período.
        </td>
      </tr>
    `;
    return;
  }

  const ordenados =
    [...lista].sort((a, b) =>
      String(a.nomeAluno || '')
        .localeCompare(
          String(b.nomeAluno || ''),
          'pt-BR'
        )
    );

  corpo.innerHTML =
    ordenados.map(aluno => {
      const status =
        String(
          aluno.status ||
          'SEM STATUS'
        )
          .trim()
          .toUpperCase();

      return `
        <tr>
          <td>
            <span class="nome-aluno-frequencia">
              ${escapar(
                aluno.nomeAluno || ''
              )}
            </span>

            <span
              class="
                status-aluno-frequencia
                ${obterClasseStatusAlunoFrequencia(
                  status
                )}
              "
            >
              ${escapar(status)}
            </span>
          </td>

          <td>${Number(aluno.totalAulas || 0)}</td>
          <td>${Number(aluno.presencas || 0)}</td>
          <td>${Number(aluno.faltas || 0)}</td>

          <td>
            <span
              class="
                selo-frequencia-painel
                ${classePercentualPainelFrequencia(
                  aluno.percentual
                )}
              "
            >
              ${formatarPercentualPainelFrequencia(
                aluno.percentual
              )}%
            </span>
          </td>
        </tr>
      `;
    }).join('');
}


function renderizarGraficoPainelFrequencia(
  alunos
) {
  garantirEstilosPainelFrequencia();

  const container =
    document.getElementById(
      'graficoBarrasFrequenciaAlunos'
    );

  if (!container) {
    return;
  }

  const lista =
    Array.isArray(alunos)
      ? alunos
      : [];

  if (!lista.length) {
    container.innerHTML = `
      <div class="estado-vazio">
        Nenhum dado disponível para o gráfico.
      </div>
    `;
    return;
  }

  const ordenados =
    [...lista].sort((a, b) =>
      Number(b.percentual || 0) -
        Number(a.percentual || 0) ||
      Number(b.presencas || 0) -
        Number(a.presencas || 0) ||
      String(a.nomeAluno || '')
        .localeCompare(
          String(b.nomeAluno || ''),
          'pt-BR'
        )
    );

  container.innerHTML =
    ordenados.map(aluno => {
      const percentual =
        Math.min(
          100,
          Math.max(
            0,
            Number(
              aluno.percentual || 0
            )
          )
        );

      const percentualFormatado =
        formatarPercentualPainelFrequencia(
          percentual
        );

      const status =
        String(
          aluno.status ||
          'SEM STATUS'
        )
          .trim()
          .toUpperCase();

      const exibirDentro =
        percentual >= 28;

      return `
        <div class="linha-grafico-frequencia-profissional">
          <div class="dados-aluno-grafico-frequencia">
            <span
              class="nome-aluno-grafico-frequencia"
              title="${escaparAtributo(
                aluno.nomeAluno || ''
              )}"
            >
              ${escapar(
                aluno.nomeAluno || ''
              )}
            </span>

            <small class="status-aluno-grafico-frequencia">
              ${escapar(status)}
            </small>
          </div>

          <div class="trilho-grafico-frequencia-profissional">
            <div
              class="
                barra-grafico-frequencia-profissional
                ${classePercentualPainelFrequencia(
                  percentual
                )}
              "
              style="
                width:${percentual}%;
              "
            >
              ${
                exibirDentro
                  ? `
                    <span class="valor-dentro-barra-frequencia">
                      ${percentualFormatado}%
                    </span>
                  `
                  : ''
              }
            </div>
          </div>

          <div class="valor-grafico-frequencia-profissional">
            ${
              exibirDentro
                ? ''
                : `${percentualFormatado}%`
            }
          </div>
        </div>
      `;
    }).join('');
}


function classePercentualPainelFrequencia(
  percentual
) {
  const valorPercentual =
    Number(percentual || 0);

  if (valorPercentual >= 90) {
    return 'frequencia-alta';
  }

  if (valorPercentual >= 75) {
    return 'frequencia-media';
  }

  return 'frequencia-baixa';
}



function formatarPercentualPainelFrequencia(
  percentual
) {
  return Number(percentual || 0)
    .toLocaleString(
      'pt-BR',
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 1
      }
    );
}


function definirTextoPainelFrequencia(
  id,
  texto
) {
  const elemento =
    document.getElementById(id);

  if (elemento) {
    elemento.textContent = texto;
  }
}

   RELATÓRIOS DE FREQUÊNCIA EM PDF
   ========================================================= */

function exportarPdfTurmaFrequencia() {
  const turma =
    valor('filtroTurmaFrequencia');

  const mesInicial =
    valor('filtroMesInicialFrequencia');

  const mesFinal =
    valor('filtroMesFinalFrequencia');

  if (!turma) {
    mostrarMensagem(
      'Selecione uma turma antes de gerar o PDF.',
      'erro'
    );
    return;
  }

  if (!mesInicial || !mesFinal) {
    mostrarMensagem(
      'Informe o mês inicial e o mês final.',
      'erro'
    );
    return;
  }

  if (mesInicial > mesFinal) {
    mostrarMensagem(
      'O mês inicial não pode ser posterior ao mês final.',
      'erro'
    );
    return;
  }

  executarGeracaoPdfFrequencia_({
    idBotao: 'botaoPdfTurmaFrequencia',
    textoCarregando: 'Gerando PDF da turma...',
    executar(executor) {
      executor.gerarPdfFrequenciaTurma({
        turma,
        mesInicial,
        mesFinal
      });
    }
  });
}


function exportarPdfGeralFrequencia() {
  const mesInicial =
    valor('filtroMesInicialFrequencia');

  const mesFinal =
    valor('filtroMesFinalFrequencia');

  if (!mesInicial || !mesFinal) {
    mostrarMensagem(
      'Informe o mês inicial e o mês final.',
      'erro'
    );
    return;
  }

  if (mesInicial > mesFinal) {
    mostrarMensagem(
      'O mês inicial não pode ser posterior ao mês final.',
      'erro'
    );
    return;
  }

  const confirmou =
    confirm(
      'Gerar um único PDF com todas as turmas em andamento? O processamento pode levar alguns segundos.'
    );

  if (!confirmou) {
    return;
  }

  executarGeracaoPdfFrequencia_({
    idBotao: 'botaoPdfGeralFrequencia',
    textoCarregando: 'Gerando PDF geral...',
    executar(executor) {
      executor.gerarPdfFrequenciaTurmasAtivas({
        mesInicial,
        mesFinal
      });
    }
  });
}


function executarGeracaoPdfFrequencia_(
  configuracao
) {
  const botao =
    document.getElementById(
      configuracao.idBotao
    );

  const textoOriginal =
    botao
      ? botao.innerHTML
      : '';

  bloquearBotoesRelatorioFrequencia_(
    true
  );

  if (botao) {
    botao.textContent =
      configuracao.textoCarregando;
  }

  mostrarAvisoGeracaoPdfFrequencia_(
    configuracao.textoCarregando,
    'processando'
  );

  const executor =
    google.script.run
      .withSuccessHandler(resultado => {
        bloquearBotoesRelatorioFrequencia_(
          false
        );

        if (botao) {
          botao.innerHTML =
            textoOriginal;
        }

        mostrarAvisoGeracaoPdfFrequencia_(
          resultado &&
          resultado.mensagem
            ? resultado.mensagem
            : 'PDF gerado com sucesso.',
          'sucesso'
        );

        const url =
          resultado &&
          (
            resultado.urlDownload ||
            resultado.url
          );

        if (url) {
          abrirArquivoPdfFrequencia_(url);
        }
      })
      .withFailureHandler(erro => {
        bloquearBotoesRelatorioFrequencia_(
          false
        );

        if (botao) {
          botao.innerHTML =
            textoOriginal;
        }

        const mensagem =
          erro && erro.message
            ? erro.message
            : String(
                erro ||
                'Não foi possível gerar o PDF.'
              );

        mostrarAvisoGeracaoPdfFrequencia_(
          mensagem,
          'erro'
        );

        mostrarMensagem(
          mensagem,
          'erro'
        );
      });

  configuracao.executar(executor);
}


function bloquearBotoesRelatorioFrequencia_(
  bloquear
) {
  [
    'botaoPdfTurmaFrequencia',
    'botaoPdfGeralFrequencia'
  ].forEach(id => {
    const botao =
      document.getElementById(id);

    if (botao) {
      botao.disabled =
        Boolean(bloquear);
    }
  });
}


function abrirArquivoPdfFrequencia_(
  url
) {
  const link =
    document.createElement('a');

  link.href = url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';

  document.body.appendChild(link);
  link.click();
  link.remove();
}


function mostrarAvisoGeracaoPdfFrequencia_(
  texto,
  tipo
) {
  let aviso =
    document.getElementById(
      'avisoGeracaoPdfFrequencia'
    );

  if (!aviso) {
    aviso =
      document.createElement('div');

    aviso.id =
      'avisoGeracaoPdfFrequencia';

    aviso.className =
      'aviso-geracao-pdf-frequencia';

    document.body.appendChild(aviso);
  }

  aviso.className =
    `aviso-geracao-pdf-frequencia aviso-pdf-${tipo}`;

  aviso.innerHTML = `
    <span class="aviso-pdf-icone">
      ${
        tipo === 'sucesso'
          ? '✓'
          : tipo === 'erro'
            ? '!'
            : '…'
      }
    </span>

    <span>${escapar(texto)}</span>
  `;

  aviso.classList.add('visivel');

  clearTimeout(
    window.timerAvisoPdfFrequencia
  );

  if (tipo !== 'processando') {
    window.timerAvisoPdfFrequencia =
      setTimeout(() => {
        aviso.classList.remove(
          'visivel'
        );
      }, 6000);
  }
}

  const pagamentos = aba === 'pagamentos';
  document.getElementById('painelControleProfessoresSIGA')?.classList.toggle('oculto', pagamentos);
  document.getElementById('painelPagamentosProfessoresSIGA')?.classList.toggle('oculto', !pagamentos);
  document.getElementById('abaControleProfessores')?.classList.toggle('ativa', !pagamentos);
  document.getElementById('abaPagamentosProfessores')?.classList.toggle('ativa', pagamentos);

function definirMesAtualPagamentosProfessoresSIGA() {

  campo.value = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`;

function carregarPagamentosProfessoresSIGA(preservarFiltros) {
  definirMesAtualPagamentosProfessoresSIGA();

  const professor = valor('filtroProfessorPagamento');

  google.script.run
    .withSuccessHandler(resultado => {
      if (botao) { botao.disabled = false; botao.textContent = 'Atualizar'; }
      renderizarPagamentosProfessoresSIGA(resultado, preservarFiltros ? professor : '', preservarFiltros ? turma : '');

    .withFailureHandler(erro => {

      exibirErro(erro);

function renderizarPagamentosProfessoresSIGA(resultado, professorAtual, turmaAtual) {

      <tr data-professor="${escapar(item.professor || '')}" data-data-aula="${escapar(item.dataAula || '')}" data-turma="${escapar(item.turma || '')}">
        <td><strong>${escapar(item.professor || '')}</strong></td>
        <td>${escapar(item.dataAula || '')}</td>

        <td><input id="horasProfessor_${item.linhaPlanilha}" data-linha-pagamento="${item.linhaPlanilha}" data-salvo="${item.salvo ? '1' : '0'}" class="entrada-pagamento-professor" type="number" min="0" step="0.25" value="${Number(item.horas || 0)}" ${item.salvo ? 'disabled' : ''}></td>
        <td><input id="valorHoraProfessor_${item.linhaPlanilha}" class="entrada-pagamento-professor" type="number" min="0" step="0.01" value="${Number(item.valorHora || 0).toFixed(2)}" ${item.salvo ? 'disabled' : ''}></td>
        <td><strong>${formatarMoedaPagamentoProfessorSIGA(item.valorPagar || 0)}</strong></td>
        <td><div class="acoes-linha-pagamento-professor">
          ${item.salvo ? `<button type="button" class="botao botao-secundario" onclick="editarLinhaPagamentoProfessorSIGA(${Number(item.linhaPlanilha)}, this)">Editar</button>` : '<span class="subtitulo">Novo</span>'}
          <button type="button" class="botao botao-excluir-pagamento-professor" onclick="excluirLinhaPagamentoProfessorSIGA(${Number(item.linhaPlanilha)}, this)">Excluir</button>
        </div></td>
      </tr>`).join('') : '<tr><td colspan="7" class="estado-vazio">Nenhuma aula realizada foi encontrada para os filtros selecionados.</td></tr>';
  }
  const listaTurmas = document.getElementById('listaTurmasPagamentoManualSIGA');

function editarLinhaPagamentoProfessorSIGA(linhaPlanilha, botao) {

function salvarPagamentosProfessoresEmLoteSIGA() {
  const registros = [...document.querySelectorAll('[data-linha-pagamento]')]
    .filter(campo => campo.dataset.salvo !== '1')
    .map(campo => {
      const linhaPlanilha = Number(campo.dataset.linhaPagamento);
      return {
        linhaPlanilha,
        turma: document.getElementById(`turmaProfessor_${linhaPlanilha}`)?.value?.trim() || '',

function percentualBolsaTelaSIGA_(valorBolsa) {
  const texto = String(valorBolsa ?? '').trim();
  const normalizado = normalizarBuscaMatriculasSIGA(texto);
  if (!texto || ['NAO', 'N', 'FALSE', 'FALSO'].includes(normalizado)) return '';
  if (['SIM', 'S', 'TRUE', 'VERDADEIRO'].includes(normalizado)) return 100;

  const possuiPercentual = texto.includes('%');
  const numero = Number(texto.replace('%', '').replace(/\s/g, '').replace(',', '.'));
  if (!Number.isFinite(numero) || numero <= 0) return '';
  return Math.min(100, possuiPercentual || numero > 1 ? numero : numero * 100);
}

/*
 * Só entrega o que foi digitado. Quem valida e converte para fração é
 * normalizarBolsaSIGA_, no servidor — que também é chamado pela edição de
 * matrícula e pelo cadastro de aluno existente.
 *
 * A versão anterior recusava 0 (`percentual <= 0` devolvia null) e a tela
 * respondia "informe de 1 a 100 ou deixe em branco", sendo que o campo
 * ESTAVA em branco: Number('') é 0. Ter a mesma regra escrita aqui e no
 * servidor foi o que deixou as duas discordarem.
 */
function valorBolsistaPlanilhaSIGA_(valorTela) {
  return String(valorTela ?? '').trim();
}

function preencherPercentualBolsistaSIGA_(idCampo, valorPlanilha) {
  const campo = document.getElementById(idCampo);
  if (campo) campo.value = String(percentualBolsaTelaSIGA_(valorPlanilha));
}

function fecharModalPagamentoProfessorManualSIGA() {
  document.getElementById('modalPagamentoProfessorManualSIGA')?.classList.add('oculto');

}

function fecharModalPagamentoProfessorManualForaSIGA(evento) {

}

function numeroPagamentoProfessorManualSIGA_(valorNumero) {
  const texto = String(valorNumero || '').trim().replace(/R\$/gi, '').replace(/\s/g, '');
  if (!texto) return 0;
  const numero = Number(texto.includes(',') ? texto.replace(/\./g, '').replace(',', '.') : texto);
  return Number.isFinite(numero) ? numero : 0;
}

function calcularPagamentoProfessorManualSIGA() {
  const horas = numeroPagamentoProfessorManualSIGA_(document.getElementById('manualPagamentoProfessorHoras')?.value);
  const valorHora = numeroPagamentoProfessorManualSIGA_(document.getElementById('manualPagamentoProfessorValorHora')?.value);
  definirTextoControle('manualPagamentoProfessorTotal', formatarMoedaPagamentoProfessorSIGA(horas * valorHora));
}

function mostrarErroPagamentoProfessorManualSIGA_(mensagem) {
