  if (!area) return;
  area.textContent = mensagem || '';
  area.classList.toggle('oculto', !mensagem);
}

function limparPagamentoProfessorManualSIGA_() {
  ['manualPagamentoProfessorNome','manualPagamentoProfessorData','manualPagamentoProfessorTurma','manualPagamentoProfessorHoras','manualPagamentoProfessorValorHora'].forEach(id => {
    const campo = document.getElementById(id); if (campo) campo.value = '';
  });
  calcularPagamentoProfessorManualSIGA();
}

function salvarPagamentoProfessorManualSIGA() {
  const dados = {
    professor: String(document.getElementById('manualPagamentoProfessorNome')?.value || '').trim(),
    dataAula: String(document.getElementById('manualPagamentoProfessorData')?.value || '').trim(),
    turma: String(document.getElementById('manualPagamentoProfessorTurma')?.value || '').trim(),
    horas: document.getElementById('manualPagamentoProfessorHoras')?.value || '',
    valorHora: document.getElementById('manualPagamentoProfessorValorHora')?.value || ''
  };
  if (!dados.professor || !dados.dataAula || !dados.turma || numeroPagamentoProfessorManualSIGA_(dados.horas) <= 0 || numeroPagamentoProfessorManualSIGA_(dados.valorHora) <= 0) {
    mostrarErroPagamentoProfessorManualSIGA_('Preencha professor, data, turma, horas e valor da hora com valores válidos.'); return;
  }
  const botao = document.getElementById('botaoSalvarPagamentoProfessorManualSIGA');
  if (botao) { botao.disabled = true; botao.textContent = 'Salvando...'; }
  mostrarErroPagamentoProfessorManualSIGA_('');
  google.script.run.withSuccessHandler(resultado => {
    if (botao) { botao.disabled = false; botao.textContent = 'Salvar lançamento'; }
    limparPagamentoProfessorManualSIGA_(); fecharModalPagamentoProfessorManualSIGA();
    const mes = document.getElementById('mesPagamentoProfessor'); if (mes) mes.value = dados.dataAula.slice(0, 7);
    const fp = document.getElementById('filtroProfessorPagamento'), ft = document.getElementById('filtroTurmaPagamento');
    if (fp) fp.value = ''; if (ft) ft.value = '';
    mostrarMensagem(resultado?.mensagem || 'Lançamento manual salvo com sucesso.', 'sucesso');
    carregarPagamentosProfessoresSIGA();
  }).withFailureHandler(erro => {
    if (botao) { botao.disabled = false; botao.textContent = 'Salvar lançamento'; }
    mostrarErroPagamentoProfessorManualSIGA_(erro?.message || String(erro));
  }).inserirPagamentoProfessorManualSIGA(dados);
}

function renderizarGraficoPagamentosProfessoresSIGA(itens) {
  const grafico = document.getElementById('graficoPagamentosProfessores');
  if (!grafico) return;
  if (!itens.length) {
    grafico.innerHTML = '<div class="estado-vazio">Ainda não há valores preenchidos para exibir.</div>';
    return;
  }
  const maior = Math.max(...itens.map(item => Number(item.valor || 0)), 1);
  grafico.innerHTML = itens.map(item => `
    <div class="linha-grafico-professor">
      <strong>${escapar(item.professor || '')}</strong>
      <div class="barra-fundo-professor"><div class="barra-professor" style="width:${Math.max(0, Number(item.valor || 0)) / maior * 100}%"></div></div>
      <span>${formatarMoedaPagamentoProfessorSIGA(item.valor || 0)}</span>
    </div>`).join('');
}

function formatarMoedaPagamentoProfessorSIGA(valorNumero) {
  return Number(valorNumero || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatarNumeroPagamentoProfessorSIGA(valorNumero) {
  return Number(valorNumero || 0).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
}

function abrirCancelamentoBoletosSIGA() {
  esconderMensagem();
  esconderTelas();
  const tela = document.getElementById('tela-cancelamento-boletos');
  if (!tela) {
    mostrarMensagem('A tela de cancelamento de boletos não foi encontrada.', 'erro');
    return;
  }
  tela.classList.remove('oculto');
  resetarRolagemPrincipalSIGA();
  carregarCancelamentoBoletosSIGA();
}

function voltarCancelamentoBoletosParaAlunosSIGA() {
  esconderTelas();
  document.getElementById('tela-alunos')?.classList.remove('oculto');
  resetarRolagemPrincipalSIGA();
}

function carregarCancelamentoBoletosSIGA() {
  const corpo = document.getElementById('corpoCancelamentoBoletosSIGA');
  const botao = document.getElementById('botaoAtualizarCancelamentoBoletosSIGA');
  const total = document.getElementById('totalCancelamentoBoletosSIGA');

  if (!corpo) return;

  const requisicao =
    (carregarCancelamentoBoletosSIGA._seq || 0) + 1;
  carregarCancelamentoBoletosSIGA._seq = requisicao;

  const atual = () =>
    carregarCancelamentoBoletosSIGA._seq === requisicao;

  const liberar = () => {
    if (botao) {
      botao.disabled = false;
      botao.textContent = '↻ Atualizar';
    }
  };

  const mostrarErro = erro => {
    if (!atual()) return;

    liberar();

    const mensagem = erro && erro.message
      ? erro.message
      : String(erro || 'Erro desconhecido.');

    if (total) total.textContent = '—';

    corpo.innerHTML =
      '<tr><td colspan="4" class="estado-vazio"></td></tr>';

    corpo.querySelector('td').textContent =
      'Não foi possível carregar os cancelamentos: ' + mensagem;

    console.error('Cancelamento de boletos:', erro);
  };

  corpo.innerHTML =
    '<tr><td colspan="4" class="estado-vazio">Carregando...</td></tr>';

  if (total) total.textContent = '—';

  if (botao) {
    botao.disabled = true;
    botao.textContent = '↻ Atualizando...';
  }

  try {
    google.script.run
      .withSuccessHandler(resultado => {
        if (!atual()) return;

        if (
          !resultado ||
          resultado.sucesso !== true ||
          !Array.isArray(resultado.registros)
        ) {
          mostrarErro(new Error(
            resultado && resultado.mensagem
              ? resultado.mensagem
              : 'O servidor não retornou uma lista válida de recorrências.'
          ));
          return;
        }

        try {
          cancelamentosBoletosSIGA = resultado.registros;
          filtrarCancelamentoBoletosSIGA();
        } catch (erro) {
          mostrarErro(erro);
        } finally {
          liberar();
        }
      })
      .withFailureHandler(mostrarErro)
      .listarRecorrenciasParaCancelarSIGA();

  } catch (erro) {
    mostrarErro(erro);
  }
}

function filtrarCancelamentoBoletosSIGA() {
  /*
   * normalizarTexto vive no Code.gs — é função de servidor. Chamada aqui,
   * no navegador, estoura "is not defined" e derruba a tela inteira, que
   * é o que acontecia ao abrir Cancelamento de boletos. O equivalente do
   * lado do cliente é normalizarBuscaMatriculasSIGA, logo acima neste
   * mesmo arquivo.
   */
  const termo = normalizarBuscaMatriculasSIGA(
    document.getElementById('buscaCancelamentoBoletosSIGA')?.value || ''
  );
  const lista = cancelamentosBoletosSIGA.filter(item =>
    !termo ||
    normalizarBuscaMatriculasSIGA(
      [item.nomeAluno, item.turma, item.status].join(' ')
    ).includes(termo)
  );
  document.getElementById('totalCancelamentoBoletosSIGA').textContent = String(cancelamentosBoletosSIGA.length);
  renderizarCancelamentoBoletosSIGA(lista);
}

function renderizarCancelamentoBoletosSIGA(lista) {
  const corpo = document.getElementById('corpoCancelamentoBoletosSIGA');
  if (!corpo) return;
  if (!lista.length) {
    corpo.innerHTML = '<tr><td colspan="4" class="estado-vazio">Nenhuma recorrência pendente de cancelamento.</td></tr>';
    return;
  }
  corpo.innerHTML = lista.map(item => `
    <tr id="linhaRecorrenciaSIGA_${escaparAtributo(item.idMatricula)}">
      <td><strong>${escapar(item.nomeAluno || '—')}</strong></td>
      <td>${escapar(item.turma || '—')}</td>
      <td><span class="status-cancelamento-boleto-siga">${escapar(item.status || '—')}</span></td>
      <td>
        <label class="check-cancelamento-boleto-siga">
          <input type="checkbox" onchange="confirmarCancelamentoRecorrenciaSIGA(this,'${escaparAtributo(item.idMatricula)}')">
          Cancelada
        </label>
      </td>
    </tr>
  `).join('');
}

function confirmarCancelamentoRecorrenciaSIGA(check, idMatricula) {
  if (!check.checked) return;
  check.disabled = true;
  google.script.run
    .withSuccessHandler(() => {
      cancelamentosBoletosSIGA = cancelamentosBoletosSIGA.filter(item => String(item.idMatricula) !== String(idMatricula));
      document.getElementById(`linhaRecorrenciaSIGA_${idMatricula}`)?.remove();
      filtrarCancelamentoBoletosSIGA();
      mostrarMensagem('Recorrência registrada como cancelada.', 'sucesso');
    })
    .withFailureHandler(erro => {
      check.checked = false;
      check.disabled = false;
      exibirErro(erro);
    })
    .marcarRecorrenciaCanceladaSIGA(idMatricula);
}

</script>
